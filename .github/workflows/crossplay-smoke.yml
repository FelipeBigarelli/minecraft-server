name: Crossplay smoke

on:
  push:
    branches: [main, feat/switch-crossplay]
    paths:
      - '.github/workflows/crossplay-smoke.yml'
      - 'server/**'
      - 'plugin/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crossplay-smoke.yml'
      - 'server/**'
      - 'plugin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: plugin/pom.xml
      - name: Build isolated server with the real setup
        shell: bash
        run: |
          set -euo pipefail
          export SERVER_DIR="$RUNNER_TEMP/biga-crossplay-smoke"
          RAM=2G bash server/scripts/setup.sh
          bash "$SERVER_DIR/scripts/doctor.sh"
      - name: Boot and test Bedrock UDP, economy and safe reinstall
        env:
          SERVER_DIR: ${{ runner.temp }}/biga-crossplay-smoke
        run: python3 server/tests/smoke_crossplay.py "$SERVER_DIR"
      - name: Keep only diagnostic log (never runtime or keys)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crossplay-smoke-log
          path: ${{ runner.temp }}/biga-crossplay-smoke/crossplay-smoke.log
          if-no-files-found: ignore
          retention-days: 3
