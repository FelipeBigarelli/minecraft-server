name: Crossplay source audit
on:
  push:
    branches: [feat/switch-crossplay]
    paths: [.github/workflows/crossplay-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/crossplay-source.tar"
      - uses: actions/upload-artifact@v6
        with:
          name: crossplay-source
          path: ${{ runner.temp }}/crossplay-source.tar
          retention-days: 1
