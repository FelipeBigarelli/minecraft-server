# =============================================================
#  ajuda.yml — o paredão de ajuda do spawn
#
#  Construído com /biga ajuda construir, removido com
#  /biga ajuda limpar. Texto fica aqui, e não no código, para
#  reescrever sem recompilar: edite, /biga reload, construa de
#  novo.
#
#  Os textos usam MiniMessage (<gold>, <bold>, <gray>...), o
#  mesmo formato da mensagem de boas-vindas no config.yml.
# =============================================================
version: 1

layout:
  # Distância, em blocos, entre o jogador e a parede no momento
  # da construção. O comando usa a posição e o ângulo de quem
  # digitou: você mira para onde quer a parede e constrói.
  #
  # 8 deixa a parede inteira no campo de visão com 3 colunas.
  distancia: 11

  # Espaço horizontal entre o centro de dois painéis vizinhos.
  #
  # 0 = calcule sozinho. O plugin mede a linha mais larga de todos os
  # painéis (já sem as tags de cor, que não ocupam pixel na tela) e
  # abre a coluna com essa largura mais a margem abaixo.
  #
  # Deixar número fixo aqui funciona até alguém escrever uma linha mais
  # comprida — e aí os painéis se sobrepõem, sem erro nenhum no
  # console. Foi o que aconteceu na primeira versão: painéis de quase
  # 7 blocos postos a cada 4.
  espacamento: 0

  # Altura do centro de cada painel em relação aos pés de quem
  # construiu.
  altura: 1.5

  # Quantos painéis por fileira.
  #
  # 4 com 11 painéis: 4, 4 e 3 — três fileiras, nenhum painel sozinho.
  #
  # Era 3, e com 11 painéis isso virou QUATRO fileiras: 16 blocos de parede,
  # mais alta que larga. Painel acima da cabeça não se lê, se adivinha.
  #
  # Largura e altura não custam o mesmo. Para ler o painel da ponta você
  # anda dois passos; para ler o de cima você não tem o que fazer. Então a
  # conta é sempre tirar fileira e pagar em coluna — com a escala 0.7 as
  # quatro colunas dão 16 blocos de largura, menos que os 25 da versão que
  # ficou ruim antes.
  por_fileira: 4

  # Espaço vertical entre fileiras. 0 = calcule sozinho, a partir do
  # painel com mais linhas.
  espacamento_vertical: 0

  # Folga entre dois painéis, em blocos.
  #
  # Pequena de propósito. Como todos os painéis saem do mesmo tamanho (o
  # código iguala largura e altura pelo maior), o que sobra entre duas caixas
  # é exatamente este número — e 0.4 faz a parede ler como um quadro só, em
  # vez de seis placas soltas no céu. Aumente se quiser respiro.
  margem: 0.4

  escala: 0.7

  # Distância, em blocos, a partir da qual o texto some. O padrão
  # do servidor é curto de propósito: paredão só aparece de perto,
  # e assim ele não polui a paisagem das ilhas.
  alcance: 32.0

  # Quanto o painel gira em relação ao ângulo de quem construiu.
  # 180 faz o texto encarar você. Se sair de costas, troque para
  # 0 e reconstrua — é um ajuste de uma linha, sem recompilar.
  giro: 180

  # Fundo da caixa de texto, em ARGB. O primeiro par é a
  # transparência: 00 some com o fundo, FF deixa sólido.
  fundo: "90000000"

# Cada item vira um painel. A ordem aqui é a ordem na parede,
# da esquerda para a direita.
# Cor dos comandos: <#6FD3FF>, um azul claro.
#
# Comando e a unica coisa do painel que a pessoa vai DIGITAR, entao ele precisa
# se separar do texto em volta num relance. Azul claro contra o dourado do
# titulo e o cinza da explicacao da esse contraste sem brigar com a paleta.
# Argumento que a pessoa troca (<white>nome, <white>20) continua em branco.

paineis:
  - titulo: "<gradient:#FF6A00:#FFD700><bold>COMO COMEÇAR</bold></gradient>"
    linhas:
      - "<#6FD3FF>/spawn <dark_gray>— volta para cá, sempre"
      - "<#6FD3FF>/list <dark_gray>— quem está online"
      - "<#6FD3FF>/tpa <white>jogador <dark_gray>— pede teleporte"
      - "<#6FD3FF>/kit tools <dark_gray>— ferramentas de pedra"
      - ""
      - "<gray>Sua casa — pode ter mais de uma:"
      - "<#6FD3FF>/sethome <white>nome <dark_gray>— cria"
      - "<#6FD3FF>/home <dark_gray>— lista as suas"
      - "<#6FD3FF>/home <white>nome <dark_gray>— vai até ela"
      - "<#6FD3FF>/delhome <white>nome <dark_gray>— apaga"
      - ""
      - "<#E03131>Cuidado:<gray> aqui é mundo de ilhas."
      - "<gray>Marcar casa no ar é queda."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>COMO GANHAR</bold></gradient>"
    linhas:
      - "<gray>Você começa com <#FFD700><simbolo><moeda-inicial><gray>."
      - "<gray>Moeda nova só nasce de um jeito:"
      - ""
      - "<gray>1. <white>Vender ao servidor<gray>, item na mão:"
      - "<#6FD3FF>/biga eco vender"
      - "<#6FD3FF>/biga eco preco <white>coal <dark_gray>— veja antes"
      - "<dark_gray>Teto: <simbolo><recompra-dia>/dia, <simbolo><recompra-semana>/semana."
      - ""
      - "<gray>2. <white>Entregando encomenda<gray> de alguém."
      - "<gray>3. <white>Vendendo no seu baú-loja<gray>."
      - ""
      - "<#E03131>Não tem<gray> dinheiro por login, por tempo"
      - "<gray>online, mob morto ou bloco quebrado."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>SUA CARTEIRA</bold></gradient>"
    linhas:
      - "<#6FD3FF>/saldo <dark_gray>— quanto você tem"
      - "<#6FD3FF>/pay <white>jogador valor <dark_gray>— transferir"
      - "<#6FD3FF>/baltop <dark_gray>— os mais ricos do servidor"
      - ""
      - "<gray>Abrir loja e vender no baú <white>não custam."
      - ""
      - "<gray>O dinheiro é o mesmo em todos os"
      - "<gray>mundos. O que você junta na ilha"
      - "<gray>gasta no bairro de lotes."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>O QUE CUSTA</bold></gradient>"
    linhas:
      - "<gray>É por aqui que o dinheiro sai de"
      - "<gray>circulação. Ninguém recebe de volta."
      - ""
      - "<#6FD3FF>/home <dark_gray>·········· <#FFD700><simbolo>25"
      - "<#6FD3FF>/tpa <dark_gray>··········· <#FFD700><simbolo>50"
      - "<#6FD3FF>/back <dark_gray>·········· <#FFD700><simbolo>100"
      - "<#6FD3FF>/sethome <dark_gray>······· <#FFD700><simbolo>200"
      - "<#6FD3FF>/tag <dark_gray>··········· <#FFD700><simbolo><tag-preco>"
      - ""
      - "<gray>Terreno e lote têm preço próprio —"
      - "<gray>os dois painéis do lado explicam."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>SUA TAG</bold></gradient>"
    linhas:
      - "<gray>Seu apelido do lado do nome, no TAB."
      - ""
      - "<#6FD3FF>/tag comprar <white>Pescador"
      - "<#6FD3FF>/tag cor <white>aqua"
      - "<gray>vira <dark_gray>[<aqua>Pescador<dark_gray>] <white>seu nome"
      - ""
      - "<#6FD3FF>/tag comprar <white>Rei da Ilha"
      - "<#6FD3FF>/tag cor <white>light_purple"
      - "<gray>vira <dark_gray>[<light_purple>Rei da Ilha<dark_gray>] <white>seu nome"
      - "<gray>As cores liberadas:"
      - "<gold>gold <yellow>yellow <aqua>aqua <green>green"
      - "<light_purple>light_purple <red>red <blue>blue <white>white"
      - "<dark_gray>Tag <simbolo><tag-preco> · cor <simbolo><tag-cor>, uma vez só."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>ENCOMENDAS</bold></gradient>"
    linhas:
      - "<gray>Peça um item e pague adiantado."
      - "<gray>Qualquer um entrega e leva o valor."
      - ""
      - "<#6FD3FF>/encomenda criar <white>iron_ingot 64 500"
      - "<#6FD3FF>/encomenda lista <dark_gray>— o que pediram"
      - "<#6FD3FF>/encomenda entregar <white>3 <dark_gray>— e recebe"
      - "<#6FD3FF>/encomenda retirar <dark_gray>— pega o seu"
      - "<#6FD3FF>/encomenda cancelar <white>3 <dark_gray>— devolve"
      - ""
      - "<gray>O valor sai na hora e fica guardado."
      - "<gray>Ninguém entrega sem receber."
      - ""
      - "<dark_gray>Até <encomenda-limite> pedidos. O TAB completa o item."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>SUA LOJA</bold></gradient>"
    linhas:
      - "<gray>Qualquer um pode vender. É <white>de graça<gray>."
      - ""
      - "<gray>Coloque um baú, e uma placa em cima:"
      - "<dark_gray>linha 1 <gray>·· seu nome"
      - "<dark_gray>linha 2 <gray>·· quantidade"
      - "<dark_gray>linha 3 <gray>·· <white>B 10 : V 5"
      - "<dark_gray>linha 4 <gray>·· o item"
      - ""
      - "<gray><white>B<gray> é o que você cobra para vender."
      - "<gray><white>V<gray> é o que você paga para comprar."
      - ""
      - "<gray>Sem taxa, sem corte. <white>Até <lojas-limite> lojas."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>SEU TERRENO</bold></gradient>"
    linhas:
      - "<gray>No survival você <white>compra o chão<gray>."
      - "<gray>Lá dentro ninguém mexe no que é seu."
      - ""
      - "<#6FD3FF>/terreno preco <white>20 <dark_gray>— só o orçamento"
      - "<#6FD3FF>/terreno comprar <white>20 <dark_gray>— marca 20x20"
      - "<#6FD3FF>/terreno teleportar <white>1 <dark_gray>— volta lá"
      - "<#6FD3FF>/terreno ver <dark_gray>— acende as bordas"
      - "<#6FD3FF>/terreno convidar <white>nome <dark_gray>— libera"
      - "<#FFD700><simbolo><terreno-bloco><gray> por bloco de chão:"
      - "<gray>16x16 <dark_gray>·· <#FFD700><simbolo><terreno-preco-16>"
      - "<gray>32x32 <dark_gray>·· <#FFD700><simbolo><terreno-preco-32>"
      - "<dark_gray>Afaste-se <terreno-spawn> blocos do spawn."
      - "<dark_gray>Até <terreno-limite> terrenos por pessoa, e no"
      - "<dark_gray>teleporte fique parado <terreno-espera>s."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>BAIRRO DE LOTES</bold></gradient>"
    linhas:
      - "<gray>Um mundo plano, em <white>sobrevivência<gray>"
      - "<gray>igual a este. É onde fica a loja."
      - ""
      - "<#6FD3FF>/plot auto <dark_gray>— pega um lote e te leva"
      - "<#6FD3FF>/plot home <dark_gray>— volta para o seu"
      - "<#6FD3FF>/plot info <dark_gray>— de quem é este"
      - "<#6FD3FF>/plot trust <white>nome <dark_gray>— libera alguém"
      - "<#6FD3FF>/plot abandon <dark_gray>— devolve o lote"
      - ""
      - "<gray>1º lote <dark_gray>·· <#FFD700><simbolo><preco-terreno-1>"
      - "<gray>2º lote <dark_gray>·· <#FFD700><simbolo><preco-terreno-2>"
      - "<dark_gray>Cada um custa o triplo do anterior."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>SE VOCÊ MORRER</bold></gradient>"
    linhas:
      - "<gray>Suas coisas <white>não somem<gray>."
      - ""
      - "<gray>Fica um <white>túmulo<gray> onde você caiu,"
      - "<gray>e só <white>você<gray> consegue abrir."
      - ""
      - "<gray>Clique nele para pegar tudo de volta,"
      - "<gray>inclusive o XP."
      - ""
      - "<#6FD3FF>/back <dark_gray>— volta para onde você caiu"
      - ""
      - "<#E03131>No void não dá.<gray> Lá não sobra nada,"
      - "<gray>então cuidado com a beirada da ilha."

  - titulo: "<gradient:#FF6A00:#FFD700><bold>TRUQUES</bold></gradient>"
    linhas:
      - "<gray>Coisas que ninguém te conta:"
      - ""
      - "<#6FD3FF>/msg <white>jogador <dark_gray>— conversa reservada"
      - "<#6FD3FF>/r <dark_gray>— responde a última"
      - "<#6FD3FF>/mail send <white>nome <dark_gray>— recado offline"
      - "<#6FD3FF>/near <dark_gray>— quem está por perto"
      - "<#6FD3FF>/seen <white>jogador <dark_gray>— quando entrou"
      - ""
      - "<gray>Placa aceita cor: escreva <white>&6<gray> antes"
      - "<gray>do texto e a linha sai dourada."
      - ""
      - "<#6FD3FF>/pedreiro organizar <dark_gray>— arruma o baú"
      - "<#6FD3FF>/biga eco regras <dark_gray>— as regras da moeda"

# =============================================================
#  TOTENS DA PRAÇA — as placas da alameda da Biga Market
#
#  Vão em postes dos dois lados do caminho da entrada, erguidos
#  junto com a loja (/biga loja criar). Quem chega lê andando.
#
#  REGRA DE OURO: só entra aqui comando que EXISTE e que o
#  jogador comum pode rodar. Placa com comando errado é pior do
#  que placa nenhuma — ela ensina errado e some do console.
#  O paredão de ajuda é o texto longo; aqui é o lembrete.
#
#  Cada linha tem no máximo 90 pixels (o limite da placa do
#  Minecraft). O teste TotensDaPracaTest mede isso com a mesma
#  tabela de largura de fonte usada nos painéis: linha que
#  estourar quebra o build, não aparece cortada em jogo.
#
#  cor: tinta da placa (ORANGE, YELLOW, WHITE, LIME...).
#  As placas saem brilhantes, legíveis de noite.
# =============================================================
totens:
  - cor: ORANGE
    linhas:
      - "COMECE AQUI"
      - "/spawn volta"
      - "/list quem ta on"
      - "/kit tools"

  - cor: YELLOW
    linhas:
      - "GANHAR B$"
      - "item na mao:"
      - "/biga eco"
      - "vender"

  - cor: ORANGE
    linhas:
      - "SUA CARTEIRA"
      - "/saldo"
      - "/pay nome 100"
      - "/baltop"

  - cor: YELLOW
    linhas:
      - "SUA CASA"
      - "/sethome casa"
      - "/home"
      - "no ar e queda"

  - cor: ORANGE
    linhas:
      - "SEU TERRENO"
      - "/tr preco 20"
      - "/tr comprar 20"
      - "/tr teleportar"

  - cor: YELLOW
    linhas:
      - "ENCOMENDAS"
      - "/enc lista"
      - "/enc criar"
      - "/enc entregar 3"

  - cor: ORANGE
    linhas:
      - "SUA LOJA"
      - "bau + placa"
      - "e de graca"
      - "B vende, V paga"

  - cor: YELLOW
    linhas:
      - "SE MORRER"
      - "fica um tumulo"
      - "so voce abre"
      - "/back volta la"
