# =============================================================
#  BigaCore — configuração
#  Recarregue com /biga reload após editar.
# =============================================================

# Envia mensagem privada ao jogador quando ele entra.
boas-vindas-ativo: true

# -------------------------------------------------------------
#  Formato do texto: MiniMessage
#
#  Desde a migração para Paper (03/08/2026) as mensagens usam
#  MiniMessage no lugar dos códigos "&" antigos. É marcação com
#  tags que abrem e fecham, parecida com HTML.
#
#  Placeholders disponíveis (note os < >, não { }):
#    <jogador>  nick de quem entrou
#    <online>   quantidade de jogadores conectados
#
#  Cores básicas:
#    <aqua> <white> <gray> <gold> <red> <green> <yellow>
#    <dark_gray> <dark_purple> <light_purple>
#
#  Cor RGB livre — não existia com os códigos "&":
#    <color:#ff8800>laranja exato</color>
#
#  Gradiente ao longo do texto:
#    <gradient:dark_purple:gold>a profecia se cumpre</gradient>
#
#  Estilo:
#    <bold> <italic> <underlined> <strikethrough> <obfuscated>
#
#  Interatividade:
#    <hover:show_text:'texto do balão'>passe o mouse</hover>
#    <click:run_command:'/spawn'>clique para ir ao spawn</click>
#    <click:open_url:'https://biga.codes'>abrir o site</click>
#
#  Fechar tag é opcional: uma tag vale até o fim da linha ou até
#  outra sobrescrevê-la. <aqua>tudo isto fica ciano
#
#  Para escrever um "<" literal sem virar tag, use \<
# -------------------------------------------------------------
mensagem-boas-vindas: "<aqua>Bem-vindo ao servidor, <white><jogador></white>! <gray>Online agora: <online>"

# -------------------------------------------------------------
#  Loja física do spawn — Biga Market
#
#  Não usa coordenada absoluta. Em runtime o BigaCore lê o spawn
#  REAL do mundo e soma este offset para obter o centro da loja.
#
#  A fachada é automaticamente virada de volta para o spawn.
#
#  VALORES ATUAIS: a loja mora no terreno #1 do mundo 'plots',
#  comprado como terreno de admin em 30/10/2026. O spawn desse
#  mundo é (0, 65, 0), então o offset 21/21 põe o centro em
#  X=21 Z=21 e a footprint 29x30 ocupa X 7..36 e Z 7..35 — o
#  interior de grama inteiro, sem encostar na borda de
#  polished_blackstone (que fica em 6 e 37).
#
#  Trocar de terreno = recalcular. O centro precisa cair a 14
#  blocos de cada borda na largura e a 14/15 na profundidade;
#  fora disso a loja invade a borda e a validação reprova.
#
#  Antes de construir, use:
#    /biga loja local
#    /biga loja validar
#    /biga loja preview
#
#  A construção só acontece com confirmação explícita:
#    /biga loja criar CONFIRMAR
#
#  E pode ser revertida com:
#    /biga loja desfazer CONFIRMAR
#
#  Se a validação acusar árvore, água, construção ou relevo ruim,
#  altere os offsets, rode /biga reload e valide novamente.
#
#  IMPORTANTE: o BigaCore mede SOLO REAL, não a copa das árvores.
#  Folha, tronco, grama e neve nunca contam como piso.
#
#  ATENÇÃO AO CONFIG JÁ EXISTENTE EM RUNTIME
#  Chaves novas adicionadas aqui NÃO aparecem sozinhas em
#  plugins/BigaCore/config.yml. Se a sua instalação é antiga, as
#  chaves ausentes usam o padrão embutido no código, que é o mesmo
#  valor mostrado abaixo. Copie-as à mão só se quiser outro valor.
# -------------------------------------------------------------
loja-spawn:
  # Deslocamento em relação ao spawn REAL do mundo.
  offset-x: 21
  offset-z: 21

  # Diferença máxima aceita entre o solo mais baixo e o mais alto
  # da footprint. Acima disso a validação bloqueia.
  max-desnivel: 3

  # Quantos blocos de aterro a fundação pode empilhar. O piso é
  # sempre o solo MAIS ALTO da footprint, então este número só
  # aperta o limite quando for MENOR que max-desnivel. Existe para
  # impedir que a loja vire um paredão de pedra sobre o terreno.
  max-fundacao: 3

  # Quantos blocos "de construção" (ruína, pedregulho, casa de
  # aldeia, pedra lavrada) são tolerados dentro da footprint.
  # 0 = qualquer estrutura existente bloqueia a validação.
  max-blocos-construidos: 0

  # -----------------------------------------------------------
  #  Derrubar árvore dentro da footprint
  #
  #  A loja tem 31x29. Numa floresta de spruce como a do spawn
  #  atual, NENHUM ponto num raio de 140 blocos comporta isso sem
  #  derrubar árvore — a varredura do mundo confirmou.
  #
  #  false = árvore BLOQUEIA a validação (padrão, conservador).
  #  true  = a construção derruba folha e tronco da footprint.
  #
  #  Mesmo ligado, isto NUNCA derruba nada fora da footprint, não
  #  cava abaixo do solo, e não afeta líquido, baú/placa nem
  #  estrutura existente: esses continuam bloqueando sempre.
  #
  #  A madeira derrubada não vira drop. É terraplanagem.
  # -----------------------------------------------------------
  limpar-arvores: false
