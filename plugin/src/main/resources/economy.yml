# -----------------------------------------------------------------
#  COMO SE PRECIFICA AQUI: PELA PORTA, NÃO PELO STACK
#
#  A tabela original veio de servidor de mundo normal, onde o Nether
#  é uma caminhada de dois minutos. Num mundo de ilhas flutuantes ela
#  ficou errada de um jeito específico: a VARA DE BLAZE (fortaleza no
#  Nether), a PÉROLA DO END (enderman) e o CREME DE MAGMA custavam o
#  mesmo que um lote de osso. Vender barato o que está atrás de uma
#  porta não é generosidade — é apagar a porta. Quem pode comprar
#  pérola a 32 B$ nunca vai caçar um enderman.
#
#  Então o preço segue o PORTÃO que o item atravessa:
#
#   1. Ilha      — o que a própria ilha dá. Tabela base.
#   2. Nether    — exige portal, ou seja, obsidiana e isqueiro.  ~4x
#   3. Fortaleza — exige achar estrutura e matar o bicho certo.  ~6x
#                  (vara de blaze, lágrima de ghast)
#   4. End       — exige a cadeia inteira antes.  Em geral só P2P.
#
#  A obsidiana é o caso especial e mora no portão 2 de propósito: ela
#  É o ingresso. A 60 B$ a unidade, um portal custa 600 B$ — uma noite
#  de jogo. Caro o bastante para ser conquista, barato o bastante para
#  não ser muro.
#
#  Lote menor junto com preço maior NÃO é redundância: um lote de 8
#  pérolas a 1.000 cada seria 8.000 na placa, e placa de quatro
#  dígitos some do alcance de quem está começando. Lote de 4 mantém a
#  decisão do tamanho de uma sessão.
# -----------------------------------------------------------------
# tier é uma classificação ECONÔMICA do BigaCore, não a rarity oficial.
# Campos ausentes server-buy/server-sell significam P2P somente naquele lado.
catalog:
  # -----------------------------------------------------------------
  #  RARIDADES — o que a ilha não dá
  #
  #  Mundo de ilhas flutuantes não tem aldeia, não tem vaca pastando e
  #  não tem floresta de cada tipo. Estes itens existem para que isso
  #  seja uma META, e não um beco sem saída.
  #
  #  Três regras valem para TODA entrada desta seção:
  #
  #  1. NENHUMA tem server-buy. O servidor vende e nunca recompra —
  #     senão bastaria comprar e revender para imprimir dinheiro, e o
  #     teto diário de recompra não cobre o que ele mesmo vendeu.
  #
  #  2. Nenhuma é item de progressão (elytra, netherite, totem...).
  #     Progressão se conquista; raridade de bioma se compra.
  #
  #  3. O preço é de OUTRA liga. Mesmo depois da correção dos portões,
  #     o resto da loja para em 1.200 por lote (vara de blaze); o ovo
  #     de aldeão custa 15.000. Com o teto de 4.000/semana por
  #     jogador, é cerca de um mês de meta — longe, alcançável, e o
  #     único ralo grande que a economia tem hoje.
  #
  #  O ovo de aldeão é o item mais caro de propósito: aldeão é a única
  #  coisa à venda que FABRICA outras coisas. Quem compra um não ganhou
  #  um item, ganhou uma fábrica.
  # -----------------------------------------------------------------
