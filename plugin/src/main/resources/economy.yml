# =============================================================
# BigaCore — Economia v1
#
# Este arquivo é a política/catálogo do servidor, não uma tabela que
# força o preço de lojas entre jogadores. P2P é referência inicial.
# "server-buy"/"server-sell" só devem virar Admin Shop quando houver
# uma decisão explícita de construir aquela loja no mundo.
# =============================================================

version: 1

currency:
  name: "Biga Coin"
  symbol: "B$"
  decimals: 0
  starting-balance: 2000

policy:
  # -----------------------------------------------------------------
  #  Preço do terreno (CreativePlots) — o primeiro RALO recorrente.
  #
  #  Até 30/10/2026 a economia só tinha torneira: imposto, criação de
  #  loja e reembolso estavam todos em 0, enquanto a recompra injeta
  #  até admin-buyback-daily-cap por jogador por dia. Entrava moeda e
  #  não saía nada.
  #
  #  Ancoragem do primeiro valor, na mesma régua do resto do catálogo
  #  (mediana de 562 BC$/hora):
  #
  #    1.200 BC$  ~=  2,1 horas de jogo
  #                =  1,5 dia no teto diário de 800
  #                =  60% do saldo inicial de 2.000
  #
  #  Ficar ABAIXO do saldo inicial é proposital: o jogador pode comprar
  #  no primeiro dia, mas gasta a maior parte da reserva. Vira escolha
  #  contra comprar material na loja, em vez de terreno grátis
  #  disfarçado de pago.
  #
  #  Lista vazia = terreno de graça. Além do último degrau o preço
  #  continua subindo pelo mesmo fator do último salto (aqui, x3).
  # -----------------------------------------------------------------
  plot-prices:
    - 1200
    - 3600
    - 10800
  chestshop-tax-percent: 0
  shop-creation-price: 0
  shop-refund-price: 0
  admin-buyback-daily-cap: 800
  admin-buyback-weekly-cap: 4000
  # PLANEJADO, NÃO APLICADO. Nenhum caminho de código lê esta chave.
  #
  # Um teto GLOBAL muda a justiça entre jogadores: quem vender primeiro no dia
  # consumiria o orçamento dos outros. Isso precisa de decisão própria antes de
  # virar código. O teto que vale hoje é por jogador (admin-buyback-*-cap).
  combined-mint-daily-cap-PLANEJADO: 200
  # PLANEJADO / NÃO APLICADO.
  #
  # A ideia original era aplicar via permissão ChestShop.shop.limit.<n>.
  # Esse node NAO EXISTE: o enum Permission do ChestShop 3.13-pre-1 tem 34
  # nodes e nenhum limita a QUANTIDADE de lojas — os NOLIMIT_* são sobre
  # limite de PREÇO. Verificado no jar instalado, não na documentação.
  #
  # Se um dia virar necessidade real, o caminho é PreShopCreationEvent
  # (existe e é cancelável, com getPlayer()), contando as lojas do UUID.
  # Isso exige decidir antes como contar de forma confiável: loja destruída,
  # placa removida fora do fluxo, mundo restaurado de backup.
  #
  # Não instale um gerenciador de permissões esperando que isto funcione.
  player-shop-first-limit: 6
  allow-partial-transactions: false
  auto-sell-enabled: false
  admin-buyback-enabled-at-launch: true

# =============================================================
# Biga Market como loja DO SERVIDOR (Admin Shop)
#
# Os dois lados do balcão têm riscos opostos:
#
#   servidor VENDE  -> jogador paga -> moeda SAI de circulação -> sink, seguro
#   servidor COMPRA -> jogador ganha -> moeda ENTRA             -> faucet, perigoso
#
# Por isso eles são implementados de formas diferentes:
#
#   venda   = placas ChestShop "Admin Shop" na parede da loja, estoque infinito
#   compra  = /biga eco vender, com TETO DIÁRIO por jogador no BigaCore
#
# O ChestShop não sabe aplicar teto por jogador. Se a recompra fosse placa,
# uma farm de cobblestone AFK viraria impressora de dinheiro. Os tetos usados
# são os admin-buyback-*-cap acima, que já existiam como política escrita.
# =============================================================
admin-shop:
  # Liga as placas de venda da Biga Market.
  enabled: true

  # Liga /biga eco vender. Sem isso o servidor não compra nada de ninguém.
  buyback-enabled: true

  # A placa do balcão também COMPRA do jogador (linha "B x : y S").
  #
  # Este é o lado que cria moeda. Só ligue com o teto funcionando: o
  # ChestShopCapGuard cancela a venda que passar do limite diário. Se o console
  # avisar que o teto NÃO pôde ser ligado, desligue isto imediatamente.
  placa-compra: true

  # Usa os nomes em português da seção "nomes" na linha do item da placa.
  # O ChestShop resolve pelo itemAliases.yml gerado junto.
  # false = a placa mostra o nome do Material em inglês (sempre funciona).
  nomes-em-portugues: true

  # Cor da TINTA da placa (nome de DyeColor) e texto brilhante.
  #
  # A cor vai no bloco, nunca dentro do texto: codigo de cor no meio da linha
  # e lido pelo ChestShop junto com o nome do item, e a placa para de vender.
  # Laranja e a cor de acao do tema The Bigas; o brilho e o que torna a placa
  # legivel num salao de madeira escura.
  placa-cor: ORANGE
  placa-brilhante: true

  # Nome do dono nas placas. PRECISA ser igual ao ADMIN_SHOP_NAME do
  # plugins/ChestShop/config.yml, senão a placa vira loja de um jogador
  # chamado "Admin Shop" — que não existe — e ninguém consegue comprar.
  sign-owner: "Loja do Servidor"

  # Itens que o SERVIDOR VENDE, na ordem em que aparecem na parede do fundo.
  # O preço vem de catalog.<item>.server-sell; item sem esse campo é ignorado.
  # As vagas vêm da geometria da loja (fundo + duas laterais). O que passar
  # disso é descartado com aviso no console.
  #
  # De propósito só material de construção e consumo básico. Item de
  # progressão (diamante, elytra, netherite, totem) fica fora: se o servidor
  # vendesse isso, exploração e negociação deixariam de valer a pena.
  wall:
    - cobblestone
    - stone
    - dirt
    - grass_block
    - gravel
    - sand
    - red_sand
    - glass
    - clay_ball
    - deepslate
    - tuff
    - calcite
    - oak_log
    - spruce_log
    - birch_log
    - jungle_log
    - acacia_log
    - dark_oak_log
    - mangrove_log
    - cherry_log
    - bamboo
    - coal
    - charcoal
    - wheat
    - carrot
    - potato
    - beetroot
    - pumpkin
    - melon
    - sugar_cane
    - cocoa_beans
    - cactus
    - kelp
    - bread
    - cooked_beef
    - cooked_porkchop
    - cooked_chicken
    - cooked_mutton
    - baked_potato
    - iron_ingot
    - copper_ingot
    - gold_ingot
    - redstone
    - lapis_lazuli
    - quartz
    - amethyst_shard
    - obsidian
    - leather
    - gunpowder
