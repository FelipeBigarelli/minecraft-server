# =============================================================
#  minigames.yml — o lobby dos jogos do The Bigas
#
#  Construído com /biga lobby construir CONFIRMAR, desfeito com
#  /biga lobby desfazer CONFIRMAR. Só funciona num mundo VAZIO:
#
#      /mv create minigames normal -g BigaCore
#      /mv tp minigames
#      /biga lobby construir CONFIRMAR
#
#  A planta é um CLAUSTRO: pátio quadrado no meio, quatro
#  galerias em volta, cinco portais em cada uma. Quadrado e não
#  redondo de propósito — vinte nichos num círculo sairiam todos
#  na diagonal, e parede diagonal no Minecraft vira escada. Aqui
#  cada galeria é uma parede reta de verdade.
# =============================================================
version: 1

praca:
  # Altura do piso. A mesma do hub, para os dois mundos terem o mesmo
  # horizonte quando se olha de um portal para o outro.
  y: 100

  # Meia largura do patio quadrado do meio: 87 por 87 de chao livre.
  patio: 43

  # A galeria que cerca o patio: dez de profundidade, vinte de altura.
  # Vinte de parede em volta de oitenta e sete de praca da a proporcao de
  # praca italiana — alto o bastante para imponer, baixo o bastante para
  # nao virar poco.
  galeria-profundidade: 10
  galeria-altura: 20

  # A passarela em cima da galeria, de onde se ve o patio inteiro.
  # Sobe pelas quatro torres e entra por quatro pontes.
  galeria-superior: 21

  # Os cinco nichos de cada galeria ficam nestes deslocamentos ao longo
  # dela. Catorze de distancia da treze de nicho e um de respiro — e o
  # que faz a arcada ter ritmo em vez de virar fileira de buracos.
  vaos: [-28, -14, 0, 14, 28]

  # Meia largura do arco por onde se passa: 3 da sete de vao.
  vao-largura: 3
  vao-altura: 11

  # Espessura de cada montante ao lado do arco. Vao 3 + pilar 3 da meia
  # largura 6, ou seja nicho de treze.
  nicho-pilar: 3

  # A torreta aberta sobre cada canto da passarela: quatro pilares e
  # um telhado, com a passarela passando por baixo. Quanto ela sobe
  # acima da passarela.
  #
  # A ESCADA nao esta aqui porque nao se escolhe: ela sobe dentro do
  # macico da galeria, e o tamanho do poco sai da altura da galeria
  # (meio bloco por celula, 2xaltura celulas num anel de perimetro
  # 2(W+H)-4). Mexer na altura reajusta o poco sozinho.
  torreta-altura: 10

  # O monumento do meio: o podio, o pavilhao e o portal de volta para o
  # hub. Fica tres degraus acima do patio para ninguem atravessar de
  # volta sem querer ao cruzar a praca.
  monumento-raio: 11
  monumento-altura: 22

  # O quadro suspenso sobre o patio.
  anel-altura: 34
  anel-raio: 24

  # Quanto o estrado passa da galeria, como terraco externo.
  borda-externa: 6

paleta:
  piso: SMOOTH_QUARTZ
  piso-linha: LIGHT_BLUE_CONCRETE
  piso-escuro: POLISHED_DEEPSLATE
  borda: DEEPSLATE_TILES
  parapeito: QUARTZ_SLAB
  vidro: LIGHT_BLUE_STAINED_GLASS
  vidro-escuro: TINTED_GLASS
  estrutura: QUARTZ_BLOCK
  estrutura-escura: BLACK_CONCRETE
  metal: IRON_BLOCK
  luz: SEA_LANTERN
  luz-fria: END_ROD
  nucleo: AMETHYST_BLOCK

# -------------------------------------------------------------
#  A volta para o hub
# -------------------------------------------------------------
volta:
  titulo: "VOLTAR AO HUB"
  descricao: "a praça dos mundos"
  cor: "#8FD3FF"
  moldura: QUARTZ_BLOCK
  destaque: LIGHT_BLUE_CONCRETE

