# -------------------------------------------------------------
#  PARKOUR — salte sem cair
#
#  Uma árvore gigante com um caminho de blocos de musgo subindo
#  em espiral em volta dela. Trinta e dois saltos, cinco
#  checkpoints, e o relógio correndo.
#
#  Aqui ninguém é eliminado: cair custa TEMPO, não a partida.
#  É o que separa o parkour dos outros jogos da lista — perder é
#  chegar em segundo, e não ser tirado do jogo.
#
#  O percurso é GERADO por conta: a planta diz quantos saltos e a
#  que distância do tronco, e o código calcula cada plataforma. Os
#  limites de salto saem da tabela do plugin de parkour procedural
#  de referência, e o teste confere salto por salto que nenhum
#  passa do que um jogador alcança.
# -------------------------------------------------------------

mundo: parkour

arena:
  # A fiada da plataforma de largada, no pé da árvore.
  y: 100

  # Quantos saltos tem o percurso.
  saltos: 32

  # A que distância do tronco o caminho corre. Mexer nisto muda
  # quantas voltas a espiral dá: quanto menor o raio, mais fechada.
  raio: 11

  # De quantos em quantos saltos vem um checkpoint.
  checkpoint-a-cada: 6

  # Abaixo de y menos isto, o jogador volta ao último checkpoint.
  queda-abaixo: 8

  # Quanto acima do cume fica o saguão.
  saguao-folga: 12
  saguao-raio: 9
  saguao-parapeito: 4

paleta:
  placa: WARPED_WALL_SIGN

  salto: MOSS_BLOCK
  salto-duro: LIME_TERRACOTTA
  checkpoint: LIME_CONCRETE
  largada: POLISHED_ANDESITE
  chegada: GOLD_BLOCK

  tronco: OAK_LOG
  casca: STRIPPED_OAK_LOG
  folha: FLOWERING_AZALEA_LEAVES

  estrutura: QUARTZ_BLOCK
  escuro: POLISHED_DEEPSLATE
  borda: DEEPSLATE_TILES
  metal: IRON_BLOCK
  vidro: LIME_STAINED_GLASS
  luz: SEA_LANTERN
  luz-fria: END_ROD
  nucleo: EMERALD_BLOCK

  # -----------------------------------------------------------
  #  AS CORES DA RUA DO SAGUÃO
  #
  #  O saguão dos vinte jogos é uma RUA DE VILA: avenida de grama
  #  entre duas fileiras de casas de dois andares, com o andar de
  #  cima em balanço sobre a calçada, floreiras nas janelas,
  #  lampiões pendurados, bandeirinhas atravessadas no alto e um
  #  arco monumental no fundo. A planta é a mesma nos vinte; o que
  #  muda de jogo para jogo é a COR, e é aqui que ela se muda.
  #
  #  Todas as chaves abaixo são opcionais e já têm padrão. Apagar
  #  qualquer uma não quebra nada: a rua nasce na cor de fábrica.
  #  Escrever só uma muda só ela.
  #
  #    grama          GRASS_BLOCK               o leito da avenida
  #    caminho        DIRT_PATH                 a trilha do meio
  #    alvenaria      COBBLESTONE               a calçada e o alicerce
  #    reboco         BIRCH_PLANKS              o pano claro das paredes
  #    viga           DARK_OAK_LOG              o madeiramento escuro
  #    madeira        SPRUCE_PLANKS             telhado e assoalho
  #    folhagem       OAK_LEAVES                copa e floreira
  #    flor           FLOWERING_AZALEA_LEAVES   o florido da janela
  #    lampiao        LANTERN                   pendurado no balanço
  #    mastro         OAK_FENCE                 o poste da calçada
  #    tronco         OAK_LOG                   a árvore da viela
  #    bandeira       PINK_WOOL                 bandeirinha, cor um
  #    bandeira-dois  LIGHT_BLUE_WOOL           bandeirinha, cor dois
  # -----------------------------------------------------------

regras:
  # Dois: sozinho ainda dá para treinar, mas a graça é a corrida.
  minimo: 2
  maximo: 16
  contagem-segundos: 15

  # Quantos segundos o jogador fica PARADO na arena antes de a rodada
  # abrir. Sem isso a largada põe o jogador num chão que em alguns jogos
  # já está sumindo, e ele perde antes de ver onde está.
  preparo-segundos: 5
  fim-segundos: 8
  treino-sozinho: true

  # O teto da partida. Quem estiver mais adiante ganha se estourar.
  tempo-limite: 300

textos:
  titulo: "PARKOUR"
  cor: "#9BE85B"
  subtitulo: "salte sem cair"
  regras:
    - "clique em [ENTRAR] para entrar na fila"
    - "suba a árvore saltando"
    - "cair volta ao checkpoint, não elimina"
    - "o primeiro no topo ganha"
  escala-titulo: 2.6
  escala-placa: 1.6
  fundo-alpha: 0

  placa-entrar: "[ENTRAR]"
  placa-sair: "[SAIR]"
  placa-fila: "na fila"
  placa-esperando: "esperando"
  placa-jogando: "SUBINDO"
  placa-refazendo: "refazendo"
