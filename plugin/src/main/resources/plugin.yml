name: BigaCore
version: '${project.version}'
main: codes.biga.bigacore.BigaCore
author: Felipe
website: https://biga.codes
description: Plugin base para Paper 26.3

# Valores aceitos vão de 1.13 até 26.2. Declarar a versão mais
# recente diz ao servidor para NÃO aplicar camadas de
# compatibilidade legada — é o que você quer num plugin novo.
api-version: '26.3'

# STARTUP carrega antes do mundo; POSTWORLD (default) depois.
load: POSTWORLD

# Integrações opcionais: BigaCore ainda sobe sem a stack econômica,
# mas, quando ela existe, deve carregar depois dela para encontrar o
# provider Vault já registrado.
softdepend: [Vault, EternalEconomy, ChestShop]

commands:
  biga:
    description: Comando principal do BigaCore
    # Aspas obrigatórias: o "loja:" no meio da frase faria o YAML tratar a
    # linha como um mapa aninhado e o Paper recusaria o plugin.yml inteiro.
    usage: "/biga <info|eco|loja|reload|voar> — eco: status|saldo|preco|vender|regras"
    aliases: [bc]
    permission: bigacore.use

  pedreiro:
    description: Estuda uma construcao existente e refaz em outro lugar
    usage: "/pedreiro <p1|p2|estudar|obras|construir|parar|desfazer|amostra|organizar>"
    permission: bigacore.pedreiro

permissions:
  bigacore.pedreiro:
    description: Permite estudar e levantar construcoes
    default: op
  bigacore.use:
    description: Permite usar /biga e consultar a economia
    default: true
  bigacore.admin:
    description: Acesso administrativo a reload, voo e construção da loja do spawn
    default: op
    children:
      bigacore.use: true
