name: BigaCore
version: '${project.version}'
main: codes.biga.bigacore.BigaCore
author: Felipe
website: https://biga.codes
description: Plugin base para Paper 26.3

# Valores aceitos vão de 1.13 até 26.2. Declarar a versão mais
# recente diz ao servidor para NÃO aplicar camadas de
# compatibilidade legada — é o que você quer num plugin novo.
api-version: '26.3'

# STARTUP carrega antes do mundo; POSTWORLD (default) depois.
load: POSTWORLD

# Integrações opcionais: BigaCore ainda sobe sem a stack econômica,
# mas, quando ela existe, deve carregar depois dela para encontrar o
# provider Vault já registrado.
# Quem registra o provider hoje e o EssentialsX Economy (o EternalEconomy
# saiu em 28/10/2026); por isso o Essentials esta nesta lista, e nao ele.
# O CreativePlots entra aqui porque a venda de terreno le o PlotAPI dele por
# reflexao. Sem ele instalado o PlotApiBridge fica indisponivel e a cobranca se
# desliga sozinha, sem derrubar o plugin.
# O WorldGuard entra aqui porque /terreno cria regiao nele. Diferente dos
# outros, este e dependencia de COMPILACAO tambem (pom.xml), mas segue
# softdepend e nao depend: sem ele o BigaCore ainda sobe, so com /terreno
# desligado. Virar depend derrubaria o plugin inteiro — a loja, a economia,
# o pedreiro — por causa de um comando.
softdepend: [Vault, Essentials, ChestShop, CreativePlots, WorldGuard]

commands:
  biga:
    description: Comando principal do BigaCore
    # Aspas obrigatórias: o "loja:" no meio da frase faria o YAML tratar a
    # linha como um mapa aninhado e o Paper recusaria o plugin.yml inteiro.
    usage: "/biga <info|eco|loja|painel|reload|voar> — eco: status|saldo|preco|vender|regras — painel: construir|limpar"
    aliases: [bc]
    permission: bigacore.use

  terreno:
    description: Compra e administra terreno protegido no survival
    usage: "/terreno <preco|comprar|teleportar|expandir|vender|info|listar|ver|cerca|convidar|remover>"
    aliases: [lote, tr]
    permission: bigacore.terreno

  encomenda:
    description: Quadro de pedidos entre jogadores, com o dinheiro em custodia
    usage: "/encomenda <criar|lista|minhas|entregar|retirar|cancelar>"
    aliases: [enc, pedido]
    permission: bigacore.encomenda

  pedreiro:
    description: Estuda uma construcao existente e refaz em outro lugar
    usage: "/pedreiro <p1|p2|estudar|obras|construir|parar|desfazer|amostra|organizar>"
    # Sem permission aqui de proposito. Um no unico no comando barraria o
    # /pedreiro inteiro antes do executor rodar, e os subcomandos nao tem o
    # mesmo peso: organizar so mexe na ordem de um bau, construir levanta
    # centenas de blocos. Quem decide e o PedreiroCommand, subcomando a
    # subcomando.

permissions:
  bigacore.pedreiro:
    description: Permite estudar e levantar construcoes
    default: op
    children:
      bigacore.organizar: true
  bigacore.organizar:
    description: Permite arrumar o bau mirado com /pedreiro organizar
    default: true
  bigacore.use:
    description: Permite usar /biga e consultar a economia
    default: true
  bigacore.plot.isento:
    description: Reivindica terreno sem pagar
    # default: false de proposito, nao "op". Se fosse op o dono nunca pagaria e
    # nunca veria o fluxo de cobranca funcionar em jogo -- o unico jeito de
    # testar seria desopando. Quem precisar de isencao recebe por LuckPerms:
    #   /lp user <nome> permission set bigacore.plot.isento true
    default: false
  bigacore.terreno:
    description: Permite comprar e administrar terreno no survival
    default: true
  bigacore.terreno.isento:
    description: Compra e expande terreno sem pagar
    # Mesmo motivo do bigacore.plot.isento ser false e nao op: com op isento o
    # dono nunca veria a cobranca funcionar em jogo, e o unico jeito de testar
    # o fluxo de compra seria desopar.
    default: false
  bigacore.terreno.ilimitado:
    description: Ignora o limite-por-jogador do terrenos.yml
    default: false
  bigacore.encomenda:
    description: Permite abrir, entregar e cancelar encomendas
    default: true
  bigacore.encomenda.admin:
    description: Cancela a encomenda de qualquer jogador, devolvendo o dinheiro ao dono
    # Existe porque o dinheiro fica em custodia: se um jogador sumir com tres
    # pedidos abertos, sem isso o valor ficaria preso para sempre.
    default: op
  bigacore.admin:
    description: Acesso administrativo a reload, voo e construção da loja do spawn
    default: op
    children:
      bigacore.use: true
