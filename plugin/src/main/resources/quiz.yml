# -------------------------------------------------------------
#  QUIZ — quem sabe, responde
#
#  Um átrio no meio, quatro pontes e quatro tablados. A pergunta
#  aparece no painel, a opção de cada tablado aparece na placa
#  dele, e você tem nove segundos para sair do átrio e pisar na
#  sua resposta. No fim do tempo os tablados errados SOMEM.
#
#  Quatro decisões, e as três primeiras existem por causa do
#  defeito clássico do gênero, que é copiar o vizinho:
#
#  - NÃO RESPONDER É ERRAR. Sem isso o átrio seria o lugar seguro
#    e dava para esperar a revelação parado no meio. Com isso, é
#    obrigatório sair e comprometer-se.
#  - A RESPOSTA TRANCA NO PRIMEIRO PISO. Pisou, respondeu. Sem
#    isso, a disputa seria sobre quem pisa por último, e os quinze
#    de trás ficariam olhando os pés do primeiro.
#  - RAPIDEZ VALE PONTO. A eliminação decide quem fica; o ponto
#    decide quem ganha quando mais de um chega ao fim. Quem espera
#    para copiar sobrevive e perde no ponto, que é o preço certo.
#  - A RODADA SOBE DE NÍVEL. As quatro primeiras perguntas são
#    fáceis, as quatro do meio médias, as últimas difíceis. Sem
#    isso, metade da arena cai numa pergunta difícil nos primeiros
#    quinze segundos e passa três minutos assistindo.
#
#  E uma regra de salvação: se NINGUÉM acertar, a pergunta não
#  vale e ninguém cai. Uma pergunta ruim não pode acabar com a
#  partida inteira.
#
#  Para acrescentar pergunta: copie um bloco da lista, ponha o
#  'nivel' (1 fácil, 2 média, 3 difícil), escreva as opções e diga
#  em 'certa' qual delas é a resposta, contando de zero. A
#  conferência recusa a obra se a resposta certa cair quase sempre
#  na mesma posição — num quiz assim o jogador decora a posição em
#  vez de saber a resposta.
# -------------------------------------------------------------

mundo: quiz

arena:
  # A fiada do piso do átrio e dos tablados.
  y: 100

  # O átrio do meio: é de onde todo mundo parte, e estar nele
  # quando o tempo acaba conta como não ter respondido.
  atrio-raio: 5

  # Os tablados: quantos, de que raio e a que distância do meio.
  tablados: 4
  tablado-raio: 5
  tablado-anel: 16

  # A largura das pontes que ligam o átrio aos tablados.
  ponte-largura: 3

  saguao-altura: 20
  saguao-raio: 9
  saguao-parapeito: 4
  marco-altura: 16

  # A fiada do painel da pergunta, acima do átrio.
  painel-altura: 7

paleta:
  placa: CRIMSON_WALL_SIGN

  atrio: POLISHED_BLACKSTONE
  atrio-beira: CHISELED_POLISHED_BLACKSTONE
  ponte: POLISHED_BLACKSTONE_BRICKS
  poste: CRIMSON_FENCE
  poste-luz: SHROOMLIGHT
  torre: POLISHED_BLACKSTONE_BRICKS
  torre-luz: SHROOMLIGHT

  # Um material por tablado, na ordem A, B, C, D.
  tablado-a: RED_CONCRETE
  tablado-b: LIGHT_BLUE_CONCRETE
  tablado-c: YELLOW_CONCRETE
  tablado-d: LIME_CONCRETE
  tablado-beira: POLISHED_BLACKSTONE

  estrutura: POLISHED_BLACKSTONE_BRICKS
  escuro: POLISHED_BLACKSTONE
  borda: BLACKSTONE
  metal: IRON_BLOCK
  vidro: MAGENTA_STAINED_GLASS
  luz: SHROOMLIGHT
  luz-fria: END_ROD
  nucleo: AMETHYST_BLOCK

  # -----------------------------------------------------------
  #  AS CORES DA RUA DO SAGUÃO
  #
  #  O saguão dos vinte jogos é uma RUA DE VILA: avenida de grama
  #  entre duas fileiras de casas de dois andares, com o andar de
  #  cima em balanço sobre a calçada, floreiras nas janelas,
  #  lampiões pendurados, bandeirinhas atravessadas no alto e um
  #  arco monumental no fundo. A planta é a mesma nos vinte; o que
  #  muda de jogo para jogo é a COR, e é aqui que ela se muda.
  #
  #  Todas as chaves abaixo são opcionais e já têm padrão. Apagar
  #  qualquer uma não quebra nada: a rua nasce na cor de fábrica.
  #  Escrever só uma muda só ela.
  #
  #    grama          GRASS_BLOCK               o leito da avenida
  #    caminho        DIRT_PATH                 a trilha do meio
  #    alvenaria      COBBLESTONE               a calçada e o alicerce
  #    reboco         BIRCH_PLANKS              o pano claro das paredes
  #    viga           DARK_OAK_LOG              o madeiramento escuro
  #    madeira        SPRUCE_PLANKS             telhado e assoalho
  #    folhagem       OAK_LEAVES                copa e floreira
  #    flor           FLOWERING_AZALEA_LEAVES   o florido da janela
  #    lampiao        LANTERN                   pendurado no balanço
  #    mastro         OAK_FENCE                 o poste da calçada
  #    tronco         OAK_LOG                   a árvore da viela
  #    bandeira       PINK_WOOL                 bandeirinha, cor um
  #    bandeira-dois  LIGHT_BLUE_WOOL           bandeirinha, cor dois
  # -----------------------------------------------------------

regras:
  minimo: 2
  maximo: 16
  contagem-segundos: 15

  # Quantos segundos o jogador fica PARADO na arena antes de a rodada
  # abrir. Sem isso a largada põe o jogador num chão que em alguns jogos
  # já está sumindo, e ele perde antes de ver onde está.
  preparo-segundos: 5
  fim-segundos: 8
  treino-sozinho: true

  # Quantos segundos para sair do átrio e pisar na resposta.
  tempo-resposta: 9

  # Quantos segundos a revelação fica na tela antes da próxima.
  tempo-revelacao: 4

  # Quantos tiques entre o tablado sumir e quem errou ser tirado
  # da rodada — é o tempo da queda, e ela é o espetáculo.
  queda-tiques: 30

  # Quantas perguntas a rodada tem, no máximo, e quantas de cada
  # nível. A soma dos três tem de dar o total.
  perguntas-por-rodada: 12
  por-nivel: [4, 4, 4]

  # Quantos pontos um acerto vale, e quanto a rapidez acrescenta
  # no melhor caso. O ponto não elimina ninguém: ele é o desempate
  # de quem chegar vivo ao fim.
  pontos-acerto: 10
  pontos-rapidez: 10

  # Quantas fiadas abaixo do piso já conta como ter caído.
  queda-abaixo: 6

  tempo-limite: 300

textos:
  titulo: "QUIZ"
  cor: "#E57FE5"
  subtitulo: "quem sabe, responde"
  regras:
    - "clique em [ENTRAR] para entrar na fila"
    - "a pergunta aparece no painel do átrio"
    - "a opção de cada tablado está na placa dele"
    - "pisou, respondeu — e não dá para trocar"
    - "ficar no átrio conta como errar"
  escala-titulo: 2.6
  escala-placa: 1.6
  fundo-alpha: 0

  placa-entrar: "[ENTRAR]"
  placa-sair: "[SAIR]"
  placa-fila: "na fila"
  placa-esperando: "esperando"
  placa-jogando: "RESPONDENDO"
  placa-refazendo: "refazendo"

# -------------------------------------------------------------
