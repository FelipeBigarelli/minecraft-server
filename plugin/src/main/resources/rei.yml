# -------------------------------------------------------------
#  REI DA MONTANHA — some um minuto no topo
#
#  Uma montanha em degraus sobre o vazio. Quem estiver SOZINHO no
#  topo segura a coroa, e ganha quem SOMAR um minuto lá em cima.
#
#  Três regras que vêm do gênero e que são o jogo inteiro:
#
#  - O RELÓGIO DE CADA UM É INCREMENTAL. Ele anda enquanto você
#    está sozinho no topo e PARA quando você sai. Não zera: a
#    próxima subida continua de onde a anterior parou, e por isso
#    toda subida bem feita é paga.
#  - DISPUTA CONGELA. Dois no topo e nenhum dos dois relógios
#    anda. É o que faz do topo um lugar para expulsar alguém, e
#    não um lugar para dividir.
#  - A TOLERÂNCIA É DO TÍTULO, NÃO DO RELÓGIO. Quem sai do topo
#    fica com a coroa por alguns tiques. O relógio não precisa de
#    proteção porque não zera; o título precisa, senão a coroa
#    piscaria de dono a cada pulo do rei.
#
#  Ninguém é eliminado e ninguém toma dano: o que existe é um
#  bastão que EMPURRA. Quem cai da montanha volta ao pé dela e
#  perde o tempo da subida, que é castigo que basta.
# -------------------------------------------------------------

mundo: rei

arena:
  # A fiada do chão em volta da montanha.
  y: 100

  # O disco de chão. Fora dele é o vazio.
  raio: 24
  beira-aneis: 1

  # A montanha: onde começa o pé, de quantos em quantos blocos de
  # raio ela sobe uma fiada, e quantas fiadas ela tem.
  pe-raio: 18
  passo: 2
  altura: 8

  # O raio do topo — a zona que conta como "estar no topo".
  topo-raio: 3

  # As pedras de cobertura na encosta.
  pedras: 8
  pedra-raio: 12
  pedra-altura: 2

  saguao-altura: 20
  saguao-raio: 9
  saguao-parapeito: 4
  marco-recuo: 8
  marco-altura: 22

paleta:
  placa: ACACIA_WALL_SIGN

  chao: SMOOTH_STONE
  beira: POLISHED_ANDESITE
  encosta: STONE_BRICKS
  degrau: CHISELED_STONE_BRICKS
  topo: GOLD_BLOCK
  topo-beira: POLISHED_BLACKSTONE_BRICKS
  pedra: ANDESITE
  pedra-topo: MOSSY_STONE_BRICKS

  estrutura: POLISHED_BLACKSTONE_BRICKS
  escuro: POLISHED_DEEPSLATE
  borda: DEEPSLATE_TILES
  metal: IRON_BLOCK
  vidro: YELLOW_STAINED_GLASS
  luz: SHROOMLIGHT
  luz-fria: END_ROD
  nucleo: GOLD_BLOCK

regras:
  minimo: 2
  maximo: 16
  contagem-segundos: 15
  fim-segundos: 8
  treino-sozinho: true

  # Quantos segundos SOMADOS no topo ganham a partida. O relógio
  # de cada jogador para quando ele sai do topo e continua de onde
  # parou quando ele volta.
  segundos-para-ganhar: 60

  # Quantos tiques quem sai do topo continua com a COROA. O
  # relógio não zera mais, então a tolerância só evita que um pulo
  # do rei dê o título ao rival por dois tiques.
  tolerancia-tiques: 40

  # A força do bastão e quanto ele levanta.
  empurrao: 1.05
  empurrao-altura: 0.42

  # Quantos tiques entre dois empurrões do mesmo jogador.
  empurrao-carencia: 12

  # Quantas fiadas abaixo do chão já conta como ter caído para
  # fora do disco. Quem cair volta ao pé da montanha.
  queda-abaixo: 6

  # Quantos segundos quem caiu fica sem poder segurar o topo.
  castigo-segundos: 3

  # O teto da partida. Se ninguém fechar o minuto, ganha quem
  # tiver somado mais tempo no topo.
  tempo-limite: 420

textos:
  titulo: "REI DA MONTANHA"
  cor: "#FFD700"
  subtitulo: "some um minuto no topo"
  regras:
    - "clique em [ENTRAR] para entrar na fila"
    - "o bastão empurra, mas não machuca"
    - "só conta quem está SOZINHO no topo"
    - "o seu relógio para quando você sai, mas não zera"
    - "dois no topo e o relógio congela para os dois"
    - "some um minuto lá em cima e a coroa é sua"
  escala-titulo: 2.6
  escala-placa: 1.6
  fundo-alpha: 0

  placa-entrar: "[ENTRAR]"
  placa-sair: "[SAIR]"
  placa-fila: "na fila"
  placa-esperando: "esperando"
  placa-jogando: "DISPUTANDO"
  placa-refazendo: "refazendo"
