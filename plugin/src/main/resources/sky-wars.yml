# -------------------------------------------------------------
#  SKY WARS — uma ilha, um baú, uma chance
#
#  Dezesseis ilhas num anel sobre o vazio e uma ilha no meio.
#  Cada jogador cai na SUA ilha de mãos vazias, abre o baú dela,
#  se equipa com o que achou, faz ponte e luta. O último de pé
#  ganha. Não há chão: o vazio é o jogo.
#
#  O BAÚ DA ILHA É O JOGO, E ELE TINHA SIDO TIRADO
#
#  A primeira versão desta arena não tinha baú nas ilhas: o kit
#  chegava na mão de todo mundo, igual, sorteado por partida.
#  A intenção era boa — atacar a reclamação mais antiga do gênero,
#  "o baú decide a partida" (há proposta de nome próprio nos
#  fóruns: SEE, Skywars Equipment Equality) — e o resultado era
#  outro jogo. Sem baú não existe o saque, e o saque é os quinze
#  primeiros segundos de toda partida de Sky Wars: abrir, ver o
#  que veio, decidir se dá para rushar o vizinho ou se é melhor
#  esperar. Tirar o baú não consertou a loteria: apagou a partida.
#
#  Então o baú voltou, e a loteria é cercada do jeito que os
#  próprios jogadores do gênero propõem — GARANTIR O PISO, não
#  apagar o sorteio. A proposta de fórum sobre as pérolas do meio
#  diz exatamente isso: que a menor quantidade que se pode achar
#  seja garantida em pelo menos um baú. Aqui:
#
#  - A ESPADA É A MESMA EM TODA ILHA. É o nível da partida, e ele
#    é um só para todas as ilhas. A reclamação do gênero é sobre a
#    ARMA — "um abre espada de ferro e o outro abre picareta de
#    madeira" — e é na arma que a garantia tem de morder. Subir de
#    espada só existe num lugar: a ilha do meio.
#  - O RESTO VARIA, E É ISSO QUE FAZ O BAÚ VALER A PENA ABRIR.
#    Quantas peças de armadura (nunca o conjunto todo), quantos
#    blocos de ponte acima do piso, se veio arco, se veio cura.
#    Duas ilhas vizinhas quase nunca abrem a mesma coisa.
#  - O PISO É GARANTIDO EM TODA ILHA: a espada, comida, pelo menos
#    uma peça de armadura e blocos de ponte bastantes para ir até
#    o vizinho E VOLTAR. Ninguém abre um baú que o deixa preso.
#
#  OS OUTROS DOIS DEFEITOS DA REFERÊNCIA
#
#  - "QUEM FAZ PONTE RÁPIDO PEGA O BAÚ DO MEIO". A proposta do
#    fórum é uma barreira em volta do meio, que cai na hora
#    marcada — e é o que fazemos: o meio nasce fechado por uma
#    cúpula de vidro e ela cai em `segundos-para-o-meio`. Chegar
#    primeiro passa a ganhar POSIÇÃO e não o baú. A réplica dos
#    fóruns continua valendo e é boa: fazer ponte se aprende, e
#    ficar sem bloco no meio da ponte é aperto honesto.
#  - "O BAÚ DO MEIO É INÚTIL E CHATO" / "o do meio já dá vantagem
#    demais". As duas reclamações existem e são a mesma pergunta:
#    quanto o meio vale? Aqui o meio vale EXATAMENTE um nível
#    acima, e `conferirNiveis` prende as duas pontas — o melhor
#    nível ainda precisa de três golpes cheios para derrubar
#    alguém de vida cheia, e o melhor não bate mais que o dobro
#    do pior.
#
#  O SOCO MACHUCA, POUCO. De mãos vazias ninguém fica indefeso:
#  quem for rushado no segundo três tem de poder revidar. O soco
#  tira `dano-do-soco`, que é menos de metade da pior espada.
#
#  SÓ SE QUEBRA O QUE ALGUÉM COLOCOU. As ilhas não se mineram:
#  sem essa regra, a primeira jogada de todo mundo é cavar a
#  própria ilha para virar bloco de ponte, e o anel acaba sumindo
#  antes de a partida começar. O bloco de ponte é de outra cor
#  justamente para a regra ser visível.
#
#  O VAZIO TEM AUTOR. Quem foi empurrado e caiu some da partida e
#  ninguém levava o crédito na referência. Aqui o último golpe
#  vale por `credito-segundos`: quem empurrou leva o nome.
#
#  O ANEL CAI NO FIM, EM ORDEM. Depois de `segundos-de-cerco`, as
#  ilhas do anel somem uma a uma dando a volta, de um ponto
#  sorteado. Em ORDEM e não sorteado: assim dá para contar quando
#  a sua vai, e sair da ilha passa a ser decisão em vez de
#  reflexo.
# -------------------------------------------------------------

mundo: sky_wars

arena:
  y: 100

  # O anel de ilhas: quantas, em que raio, de que raio cada uma e
  # de que fundura. O vão entre duas ilhas vizinhas tem de dar
  # uma ponte curta — com 16 ilhas no raio 44 sobram uns dez
  # blocos entre vizinhas.
  ilhas: 16
  ilha-anel: 44
  ilha-raio: 3

  # Quantos andares a ilha desce, e quanto ela ESTREITA por andar.
  #
  # As ilhas eram cilindros de dois andares: o mesmo disco repetido
  # para baixo, fundo tão chato quanto o topo. De cima não se nota;
  # de qualquer outro ângulo — e num jogo sobre o vazio, todo ângulo
  # é outro ângulo — a arena parecia um tabuleiro de fichas de pôquer
  # boiando.
  #
  # Com quatro andares e um de estreitamento, o raio 3 vira 3, 2, 1 e
  # 0: a ilha fecha em ponta, que é a silhueta do mapa de referência,
  # onde cada ilha é um cogumelo com o chapéu em cima e o pé afinando.
  ilha-altura: 4
  ilha-afunilamento: 1

  # Quantos baús tem cada ilha do anel. A referência varia de um
  # a três; dois cabem numa ilha de raio 3 sem encostar no marco
  # nem no ponto de largada, e dois já dão a sensação de escolher
  # qual abrir primeiro.
  baus-da-ilha: 2

  # A ilha do meio, que é o que se disputa.
  #
  # Ela afunila MAIS por andar que as do anel, e não por capricho: ela
  # é três vezes mais larga e é a única que se vê das dezesseis ao
  # mesmo tempo. Com raio 9, seis andares e dois de estreitamento, o
  # pé dela desce 9, 7, 5, 3, 1 — a tigela funda do mapa baixado.
  meio-raio: 9
  meio-altura: 6
  meio-afunilamento: 2
  meio-baus: 4

  # A cúpula que fecha o meio até a hora marcada.
  cupula-altura: 7

  saguao-altura: 24
  saguao-raio: 10
  saguao-parapeito: 4
  marco-altura: 18
  painel-altura: 12

# -------------------------------------------------------------
#  O MAPA PRONTO
#
#  Com isto ligado, a arena deixa de ser gerada e passa a ser um
#  mapa feito à mão, lido de arquivos de ESTRUTURA — os mesmos
#  que o bloco de estrutura do jogo salva, e os que vêm dentro de
#  um mapa de Sky Wars baixado.
#
#  O que o mapa manda: quantas ilhas, onde fica cada uma, em que
#  fiada, onde vai cada baú, e o desenho inteiro.
#  O que CONTINUA nosso: o saque com piso garantido, o cerco que
#  derruba uma ilha por vez, o kit por nível, o empurrão do golpe,
#  o placar lateral, o saguão de rua e as placas.
#
#  As chaves de arena.* acima param de valer enquanto isto estiver
#  ligado, e voltam a valer inteiras num `ativo: false` — por isso
#  elas não foram apagadas.
#
#  ONDE PÔR OS ARQUIVOS
#
#  Em plugins/BigaCore/mapas/sky-wars/, fora do repositório: o
#  repositório é público e o mapa é de outra pessoa. Um mapa grande
#  vem partido numa grade de 3x3 peças de 48 blocos, encaixando de
#  47 em 47, e os arquivos se chamam <mapa>-1.nbt até <mapa>-9.nbt.
#
#  OS MARCADORES
#
#  O mapa traz entidades invisíveis dizendo onde fica cada coisa. O
#  nome da etiqueta muda de autor para autor; estes são os do mapa
#  que está instalado. Sem a etiqueta de jaula não há arena, e o
#  jogo volta sozinho para a arena gerada avisando no console.
# -------------------------------------------------------------
mapa-pronto:
  ativo: true
  pasta: mapas/sky-wars
  mapa: map1
  grade: 3
  passo: 47

  # Em que fiada do mundo a jaula tem de cair. O chão das ilhas
  # passa a ser esta fiada menos um, e todo o resto da arena —
  # saguão, altura da queda, painéis — se pendura nela.
  y-da-jaula: 101

  etiqueta-jaula: cage
  etiquetas-bau-da-ilha: [normalChest]
  etiquetas-bau-do-meio: [middleChest, centralChest]

  # -----------------------------------------------------------
  #  O RODÍZIO
  #
  #  Com 'rodizio: true' a arena troca de mapa a cada rodada,
  #  sorteando um da lista abaixo — nunca o que acabou de rodar,
  #  para que trocar signifique trocar de verdade.
  #
  #  A troca é barata porque o jogo guarda, de cada mapa, as
  #  casas exatas que ele ocupou: sai o mapa velho pelos doze mil
  #  blocos dele, entra o novo pelos doze mil dele. A área toda
  #  tem quase um milhão, e varrê-la a cada rodada travaria o
  #  servidor.
  #
  #  O saguão NÃO muda: a rua da vila se pendura em 'y-da-jaula',
  #  que é a mesma para todos os mapas. O que muda é a ilha, o
  #  anel, o alcance — e, com eles, as quatro torres de canto.
  #
  #  Cada mapa tem um desenho próprio: o anel vai de 23 a 51 e o
  #  raio da ilha de 4 a 17. Tirar um nome da lista é o jeito de
  #  aposentar um mapa de que você não gostou; deixar a lista
  #  vazia ou com um nome só volta ao mapa fixo de 'mapa:'.
  # -----------------------------------------------------------
  rodizio: true
  mapas:
    - map1
    - map2
    - map3
    - map4
    - map5
    - map6
    - map7
    - map8
    - map9
    - map10
    - map1101
    - map1102
    - map1103
    - map1104
    - map1105

paleta:
  placa: PALE_OAK_WALL_SIGN

  # AS ILHAS SÃO COGUMELOS, como no mapa de referência: chapéu
  # vermelho de pintas brancas em cima, pé branco afinando embaixo
  # até sumir no vazio. A silhueta vem do construtor (ilha-altura e
  # ilha-afunilamento, lá embaixo); a cor vem daqui.
  ilha-topo: RED_MUSHROOM_BLOCK
  ilha-corpo: MUSHROOM_STEM
  ilha-beira: RED_MUSHROOM_BLOCK
  ilha-marco: MUSHROOM_STEM

  # O TEMA DE GELO, se preferir.
  #
  # O vermelho tem um preço: contra o pôr do sol ele some, e achar a
  # ilha do outro lado do anel fica mais difícil. O gelo é o que mais
  # contrasta com o azul do vazio. Para voltar a ele, troque as
  # quatro acima por:
  #
  #   ilha-topo: SNOW_BLOCK
  #   ilha-corpo: CALCITE
  #   ilha-beira: SMOOTH_QUARTZ
  #   ilha-marco: QUARTZ_PILLAR

  meio-topo: QUARTZ_BLOCK
  meio-corpo: SMOOTH_QUARTZ
  meio-beira: CHISELED_QUARTZ_BLOCK
  meio-luz: SEA_LANTERN

  cupula: LIGHT_BLUE_STAINED_GLASS
  bau: CHEST

  # O bloco de ponte: de outra cor de propósito, para a regra de
  # "só se quebra o que alguém colocou" ser visível no chão.
  bloco-de-ponte: LIGHT_BLUE_CONCRETE

  estrutura: SMOOTH_QUARTZ
  escuro: CALCITE
  borda: WHITE_TERRACOTTA
  metal: IRON_BLOCK
  vidro: LIGHT_BLUE_STAINED_GLASS
  luz: SEA_LANTERN
  luz-fria: END_ROD
  nucleo: AMETHYST_BLOCK
  poste: QUARTZ_PILLAR
  poste-luz: SEA_LANTERN
  torre: SMOOTH_QUARTZ
  torre-luz: SEA_LANTERN
  folhagem: AZALEA_LEAVES

  # -----------------------------------------------------------
  #  AS CORES DA RUA DO SAGUÃO
  #
  #  O saguão dos vinte jogos é uma RUA DE VILA: avenida de grama
  #  entre duas fileiras de casas de dois andares, com o andar de
  #  cima em balanço sobre a calçada, floreiras nas janelas,
  #  lampiões pendurados, bandeirinhas atravessadas no alto e um
  #  arco monumental no fundo. A planta é a mesma nos vinte; o que
  #  muda de jogo para jogo é a COR, e é aqui que ela se muda.
  #
  #  Todas as chaves abaixo são opcionais e já têm padrão. Apagar
  #  qualquer uma não quebra nada: a rua nasce na cor de fábrica.
  #  Escrever só uma muda só ela.
  #
  #    grama          GRASS_BLOCK               o leito da avenida
  #    caminho        DIRT_PATH                 a trilha do meio
  #    alvenaria      COBBLESTONE               a calçada e o alicerce
  #    reboco         BIRCH_PLANKS              o pano claro das paredes
  #    viga           DARK_OAK_LOG              o madeiramento escuro
  #    madeira        SPRUCE_PLANKS             telhado e assoalho
  #    folhagem       OAK_LEAVES                copa e floreira
  #    flor           FLOWERING_AZALEA_LEAVES   o florido da janela
  #    lampiao        LANTERN                   pendurado no balanço
  #    mastro         OAK_FENCE                 o poste da calçada
  #    tronco         OAK_LOG                   a árvore da viela
  #    bandeira       PINK_WOOL                 bandeirinha, cor um
  #    bandeira-dois  LIGHT_BLUE_WOOL           bandeirinha, cor dois
  # -----------------------------------------------------------

# -------------------------------------------------------------
#  OS NÍVEIS DE SAQUE
#
#  Um nível é sorteado por PARTIDA e vale para todas as ilhas do
#  anel; a ilha do meio é sempre UM nível acima. É o eixo que a
#  referência chama de "Normal" e "Insane": a partida inteira
#  acontece num patamar de loot, e o patamar muda de partida para
#  partida.
#
#  As seis listas têm de ter o mesmo tamanho, e dano, blocos,
#  flechas e redução nunca podem DESCER de um nível para o
#  próximo — `conferirNiveis` recusa. Sem isso, "nível mais alto"
#  poderia ser pior que o mais baixo e nada no yml pareceria
#  errado: o baú do meio PIORARIA o equipamento de quem o pegou.
#
#  'armadura' é a família da peça; as quatro peças (capacete,
#  peito, calça, bota) saem dela. 'reducao' é quanto cada peça
#  equipada tira de dano, em porcento — é por ela que couro e
#  diamante significam coisas diferentes, já que o dano deste
#  servidor é contado pelo plugin e a armadura de vanilla não
#  entraria na conta sozinha.
# -------------------------------------------------------------
niveis:
  espada: [WOODEN_SWORD, STONE_SWORD, IRON_SWORD, DIAMOND_SWORD]
  dano: [14, 18, 22, 26]
  blocos: [24, 28, 32, 40]
  flechas: [0, 6, 10, 16]
  armadura: [LEATHER, CHAINMAIL, IRON, DIAMOND]
  reducao: [4, 6, 8, 10]

# -------------------------------------------------------------
#  O BAÚ DA ILHA
#
#  O piso é garantido em toda ilha; o resto é sorteado por cima
#  dele, baú por baú e ilha por ilha.
# -------------------------------------------------------------
saque:
  # Quantas peças de armadura o baú da ilha dá, no mínimo e no
  # máximo. NUNCA as quatro: o conjunto completo é o prêmio da
  # ilha do meio, e uma ilha do anel que já o desse tornaria a
  # travessia desnecessária.
  armadura-minima: 1
  armadura-maxima: 2

  # Os blocos de ponte. O piso é garantido e `conferirSaque` exige
  # que ele dê para ir até o vizinho E VOLTAR: um baú que deixa
  # alguém preso na própria ilha não é um baú ruim, é um bug.
  blocos-garantidos: 24
  blocos-extras: 16

  # A chance, em cem, de o baú da ilha trazer arco com flechas e
  # de trazer item de cura. O arco não sobe o dano da espada: é
  # outra jogada, e é por isso que ele pode faltar sem desequilibrar.
  chance-de-arco: 40
  chance-de-cura: 25

  # Quantos itens de cura o baú da ilha dá, quando dá.
  curas-na-ilha: 1

  # A comida, garantida: ninguém perde a partida de fome por azar.
  item-de-comida: COOKED_BEEF
  comida: 3

  # -----------------------------------------------------------
  #  AS FERRAMENTAS DO GÊNERO
  #
  #  Esta seção saiu de um estudo do SkyWarsReloaded, o plugin de
  #  referência. O baú dele não é uma tabela de itens: é um punhado
  #  de GRUPOS, cada um com uma porcentagem, e o baú recebe a soma
  #  dos grupos que saíram. O grupo garantido dele (a faixa de
  #  cima, que cai sempre) tem blocos, comida e — a parte que a
  #  nossa arena não tinha — BALDE DE ÁGUA E BALDE DE LAVA. O grupo
  #  de 40% tem bolas de neve, ovos e arco.
  #
  #  Faltavam aqui, e a falta era grande: nossa arena tinha espada,
  #  armadura, arco e bloco de ponte, que é o equipamento. Faltava
  #  o FERRAMENTAL — o que se usa no outro, e não em si mesmo. Em
  #  Sky Wars o balde d'água é a jogada mais característica que
  #  existe: lava-se o inimigo para fora da ponte sem encostar nele.
  #  A lava é o contrário: fecha a ponte e cobra pedágio. E a bola
  #  de neve é o empurrão a dez blocos de distância.
  #
  #  Cada ferramenta tem a SUA chance e é sorteada por baú, não por
  #  ilha nem por partida: dois baús da mesma ilha quase nunca dão
  #  a mesma coisa, e é isso que faz valer a pena abrir o segundo.
  #
  #  Nada disto entra no piso garantido. O piso é espada, comida,
  #  armadura e ponte — o que impede alguém de abrir um baú e ficar
  #  preso. Ferramenta é sorte boa, e sorte boa pode faltar.
  # -----------------------------------------------------------
  ferramentas:
    # O balde d'água. Alto de propósito: é a jogada que define o
    # gênero, e quem nunca abre um não aprende a usá-la.
    #
    # A água SOME sozinha depois de `balde-segundos`. Sem isso a
    # primeira partida deixaria cachoeiras penduradas no vazio para
    # sempre, e a segunda começaria num mapa diferente.
    chance-de-agua: 35

    # A lava. Metade da água porque ela é bem mais cruel: fecha
    # ponte, e `dano-da-lava` cobra de quem pisar. Ela também some
    # sozinha, pelo mesmo relógio.
    chance-de-lava: 16

    # As bolas de neve e quantas. Não tiram vida nenhuma: empurram.
    # Num jogo em que todo mundo anda sobre uma fileira de blocos,
    # empurrar vale mais que machucar.
    chance-de-bolas: 45
    bolas-de-neve: 8

    # A pérola, e ela só existe no baú do MEIO. É a recompensa de
    # atravessar: quem pegou o meio ganha a carta de fuga, e quem
    # não atravessou não tem como responder a ela. Uma só — duas
    # fariam do dono do meio alguém que não pode ser alcançado.
    perolas-no-meio: 1

regras:
  minimo: 2
  maximo: 16
  contagem-segundos: 15

  # Quantos segundos o jogador fica PARADO na arena antes de a rodada
  # abrir. Sem isso a largada põe o jogador num chão que em alguns jogos
  # já está sumindo, e ele perde antes de ver onde está.
  preparo-segundos: 5
  fim-segundos: 10
  treino-sozinho: true

  # A vida é do plugin, como na ARENA PVP: o dano de vanilla
  # continua cancelado e os corações na tela são o mostrador
  # desta conta.
  vida-cheia: 100

  # O período de recarga da espada, em tiques, e a carência do
  # alvo, que é igual a ele. A conta do golpe é a mesma da ARENA
  # PVP e o código é compartilhado: a espada deste servidor
  # funciona igual em toda arena.
  periodo-do-golpe: 13

  # O soco de mão vazia. Existe porque agora todo mundo larga sem
  # nada: quem for rushado antes de abrir o baú tem de poder
  # revidar. Menos da metade da pior espada, para abrir o baú
  # continuar sendo a primeira coisa a fazer.
  dano-do-soco: 6

  # A flecha: o tiro cheio é forte, e o fraco é quase nada. Mesma
  # física do ARCO E FLECHA.
  dano-da-flecha: 30
  forca-minima: 0.3

  # O teto da redução somada da armadura, em porcento. As peças
  # somam, e quatro peças de diamante somariam exatamente isto.
  # O teto escrito é o que impede que acrescentar um nível de
  # armadura ao yml transforme a vítima numa parede e a luta em
  # nada — `conferirNiveis` confere a conta contra ele.
  reducao-maxima: 40

  # O item de cura e quanto ele devolve.
  item-de-cura: GOLDEN_APPLE
  cura-do-item: 35
  curas-no-bau: 2

  empurrao: 0.5
  empurrao-altura: 0.3

  # O empurrão da BOLA DE NEVE, que é o que ela faz — ela não tira
  # vida nenhuma. Menor que o da espada de propósito: a bola é um
  # encosto de longe, não um golpe, e quem empurra com bola está
  # dez blocos longe do perigo que está criando.
  empurrao-da-bola: 0.45
  empurrao-da-bola-alto: 0.3

  # Quanto a LAVA tira por segundo, de quem estiver dentro dela.
  #
  # Ele é escrito porque TEM de ser: o dano do Minecraft está
  # cancelado nesta arena inteira — a vida é número do plugin e os
  # corações são só o mostrador. Sem esta linha, o balde de lava
  # seria um balde de tinta laranja: fecharia a ponte e não cobraria
  # nada de quem atravessasse. Doze por segundo mata em oito
  # segundos de vida cheia; atravessar correndo custa caro e é
  # possível, parar dentro é morte.
  dano-da-lava: 12

  # Quantos segundos a água e a lava do balde duram antes de secar.
  #
  # Elas secam porque este mundo não tem chão: água derramada na
  # beira de uma ilha escorre para o vazio e fica lá, escorrendo,
  # para sempre — a arena da segunda partida não seria a mesma da
  # primeira. Dez segundos é tempo de a jogada acontecer e acabar.
  balde-segundos: 10

  # Por quantos segundos o último golpe ainda dá o crédito da
  # queda no vazio a quem bateu.
  credito-segundos: 8

  # Quando a cúpula do meio cai.
  segundos-para-o-meio: 45

  # Quando o anel começa a cair, e de quanto em quanto tempo cada
  # ilha some. O aviso de cada ilha sai alguns segundos antes.
  segundos-de-cerco: 90
  segundos-por-ilha: 6
  aviso-segundos: 4

  pontos-por-queda: 50

  queda-abaixo: 25
  tempo-limite: 360

textos:
  titulo: "SKY WARS"
  cor: "#EAF4FF"
  subtitulo: "uma ilha, um baú, uma chance"
  regras:
    - "clique em [ENTRAR] para entrar na fila"
    - "você larga sem nada: abra o baú da sua ilha"
    - "a espada é a mesma em toda ilha; o resto varia"
    - "a cúpula do meio cai na hora marcada"
    - "só no meio a espada sobe de nível"
    - "só se quebra o bloco que alguém colocou"
    - "o anel cai no fim, uma ilha de cada vez, em ordem"
    - "balde d'água lava o inimigo para fora da ponte"
    - "a lava fecha a ponte e cobra pedágio"
    - "a bola de neve empurra de longe e não machuca"
    - "o vazio não perdoa, e tem autor"
  escala-titulo: 2.8
  escala-placa: 1.6
  fundo-alpha: 0

  placa-entrar: "[ENTRAR]"
  placa-sair: "[SAIR]"
  placa-fila: "na fila"
  placa-esperando: "esperando"
  placa-jogando: "NO AR"
  placa-refazendo: "refazendo"
