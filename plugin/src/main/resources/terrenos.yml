# Venda de terreno no survival.
#
# Isto NAO e um sistema de protecao novo. Cada terreno comprado aqui vira uma
# regiao de WorldGuard igual a que /rg define cria, com o comprador como owner.
# Vantagem: as flags, os comandos e as mensagens que voce ja conhece continuam
# valendo, e /rg info mostra o terreno do jogador como mostra qualquer outra
# regiao. O limite de regioes do WorldGuard (max-region-count-per-player) nao
# se aplica, porque a regiao e criada pelo plugin e nao por /rg claim — o
# limite que vale e o limite-por-jogador aqui embaixo.
#
# Depois de editar: /biga reload

version: 1

# ---------------------------------------------------------------------------
# Onde da para comprar
# ---------------------------------------------------------------------------

# Lista BRANCA de mundos. Mundo que nao esta aqui nao vende terreno.
#
# E lista branca de proposito. Com lista negra, cada mundo novo que o
# Multiverse criar — minigame, criativo, mapa de teste — nasceria vendendo
# terreno, e alguem compraria 64x64 no meio da arena antes de alguem notar.
mundos:
  - world

# Raio, em blocos, em volta do spawn do mundo onde nao se vende nada.
#
# Medido em quadrado (distancia de Chebyshev), igual ao desenho da protecao
# vanilla, e nao em circulo — com circulo os quatro cantos do quadrado em volta
# do spawn ficariam compraveis.
#
# Serve para manter o spawn, as lojas e as estradas de saida como area publica.
#
# Era 48 ate 11/11/2026. Baixou para 24 porque 48 empurrava o primeiro terreno
# para longe demais: quem comecava tinha de andar quase um minuto do spawn ate
# poder comprar qualquer coisa, e terreno que da trabalho de alcancar nao e
# comprado. 24 continua segurando a praca, as lojas e as saidas.
distancia-minima-do-spawn: 24

# Espaco obrigatorio entre dois terrenos. 0 deixa encostar.
folga-entre-terrenos: 0

# ---------------------------------------------------------------------------
# Preco
# ---------------------------------------------------------------------------

# B$ por bloco de CHAO (area), nao por bloco de volume.
#
# Com 3: 8x8 = B$192 | 16x16 = B$768 | 20x20 = B$1.200 | 32x32 = B$3.072
#        48x48 = B$6.912 | 64x64 = B$12.288
#
# O 20x20 custar o mesmo que o primeiro terreno criativo (plot-prices no
# economy.yml) nao e coincidencia: e para o jogador comparar os dois precos e
# escolher, em vez de um dos dois parecer de graca.
#
# Cobrar por area e nao por volume importa porque o terreno pega a coluna
# inteira: por volume, o MESMO 20x20 custaria o dobro num mundo com o teto mais
# alto, e o jogador nao tem como adivinhar isso.
preco-por-bloco: 3

# Lado minimo e maximo do quadrado.
#
# O minimo existe para nao encher o mapa de regiao de 2x2 usada so para trancar
# um bau. O maximo existe porque regiao grande nao se desfaz: quem compra
# 200x200 cercou um bioma inteiro para sempre.
tamanho-minimo: 8
tamanho-maximo: 64

# Quantos terrenos cada pessoa pode ter POR MUNDO.
limite-por-jogador: 3

# Multiplicador do preco pelo numero do terreno: o 1o paga x1, o 2o x2, o 3o
# x3.5. Depois do fim da lista continua subindo pela razao dos dois ultimos.
#
# O numero que conta e o do SLOT (t_nome_2), nao a quantidade que a pessoa tem
# agora. Assim o preco do "seu segundo terreno" e o mesmo hoje e depois de voce
# vender e recomprar o primeiro.
multiplicador:
  - 1.0
  - 2.0
  - 3.5

# Quanto volta no /terreno vender, em % do preco BASE (sem multiplicador).
#
# Sobre o preco base de proposito. Se o reembolso seguisse o multiplicador, o
# terceiro terreno (x3.5) devolveria 60% de 3.5 = 2.1 vezes o que um terreno
# base custa — comprar e vender daria lucro, e viraria impressora de dinheiro
# para quem tivesse paciencia de repetir. Do jeito que esta, vender sempre da
# prejuizo.
reembolso-percent: 60

# ---------------------------------------------------------------------------
# Forma da regiao
# ---------------------------------------------------------------------------

# true: o terreno vai do fundo ao teto do mundo.
#
# Deixe true. Com false, a protecao e so uma fatia de altura em volta de quem
# comprou, e esse e o furo mais explorado em survival: quem nao pode construir
# no terreno cava por baixo, sobe dentro da casa e leva tudo sem nunca quebrar
# um bloco protegido.
altura-total: true

# ---------------------------------------------------------------------------
# Mensagens das bordas
# ---------------------------------------------------------------------------

# Vao para as flags greeting e farewell da regiao, entao usam codigo & (o
# WorldGuard nao le MiniMessage nessas flags). <dono> e trocado pelo nome.
#
# Deixe mensagem-saida vazia: aviso ao entrar E ao sair dobra o chat de quem
# atravessa uma rua com terreno dos dois lados.
mensagem-entrada: "&8▎ &7Terreno de &f<dono>"
mensagem-saida: ""

# ---------------------------------------------------------------------------
# Cerca de madeira
# ---------------------------------------------------------------------------

# Uma cerca aparece na borda do terreno assim que ele e comprado, e acompanha
# o /terreno expandir. Vendeu, ela sai.
#
# Existe porque as particulas do /terreno ver duram dez segundos. Isso responde
# "onde fica a borda" na hora de comprar e nao responde mais nada: quem volta
# no dia seguinte para construir nao sabe onde pode encostar a parede.
#
# A cerca nunca apaga bloco de ninguem. Cada poste so entra onde ja existe ar
# ou mato, e coluna sem chao — a beirada de uma ilha flutuante — e pulada.
cerca:
  ativa: true

  # O poste comum e o dos quatro cantos. Canto diferente deixa achar a quina
  # de longe, que e o que a pessoa procura quando esta medindo a construcao.
  material: OAK_FENCE
  canto: OAK_LOG

  # A busca pelo chao comeca na altura de quem mandou e desce. Nao usa o bloco
  # mais alto da coluna de proposito: num mundo de ilhas empilhadas, o ponto
  # mais alto de um x/z pode estar numa ilha trinta blocos acima da que a
  # pessoa escolheu, e a cerca sairia no telhado da ilha errada.
  busca-acima: 8
  busca-abaixo: 24

  # Quantos postes por tique. Um terreno de 64x64 tem 252 postes espalhados
  # por ate 25 chunks, e ler bloco de chunk descarregado forca o carregamento
  # na hora, na thread do servidor: tudo de uma vez e engasgo para todo mundo
  # online. Em lotes o custo some, e a cerca aparece desenhando a volta.
  por-tique: 48
