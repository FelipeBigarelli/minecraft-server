# =============================================================
#  TNT RUN — a arena e as regras
#
#  A arena é gerada por código:
#    /biga tntrun info                 confere o terreno
#    /biga tntrun construir CONFIRMAR  levanta tudo
#    /biga tntrun desfazer CONFIRMAR   apaga tudo
#
#  Os pisos são refeitos sozinhos no começo de cada rodada, então
#  não há nada para limpar à mão entre partidas.
# =============================================================

# O mundo da arena. Se ele não existir, o BigaCore cria um mundo
# VAZIO com esse nome na subida — não precisa de /mv create.
#
# Para o Multiverse também passar a conhecê-lo (e valer /mvtp),
# rode uma vez: /mv import tnt_run normal -g BigaCore
mundo: tnt_run

# -------------------------------------------------------------
#  A arena
#
#  Um disco, não um quadrado. Em quadrado as quinas são armadilha:
#  quem é encurralado numa delas não tem para onde correr, e quem
#  corre pela diagonal cobre 1,41 de chão por bloco de piso gasto.
#  No disco todo mundo tem a mesma beira e a mesma saída.
# -------------------------------------------------------------
arena:
  # Altura do piso de cima. Os de baixo descem daqui.
  y: 100

  # Raio do disco. 24 dá 49 de ponta a ponta — tamanho de arena
  # para até uns doze. Mexer aqui reajusta tudo o que depende
  # dele (marcos, saguão, posições de largada) sozinho.
  #
  # Arena GRANDE com pouca gente dá rodada longa: ninguém perde por
  # falta de chão, só por erro próprio. Com duas ou três pessoas,
  # 16 (33 de ponta a ponta) deixa a partida em poucos minutos.
  # Depois de mudar, rode /biga tntrun desfazer e construir de novo.
  raio: 24

  # Quantos pisos. Três é o clássico: dois tombos de margem antes
  # de cair de verdade, e o jogador aprende a geometria do jogo
  # na primeira queda em vez de na eliminação.
  pisos: 3

  # Espessura de cada piso, em blocos. Dois: a capa de cima é o
  # TNT que se vê e a de baixo é a areia que o sustenta. As duas
  # somem juntas, senão o jogador fica em pé numa casca de areia.
  espessura: 2

  # Ar entre um piso e o de baixo.
  #
  # Três é o mínimo que o jogo aceita: com dois o jogador pula de
  # volta para o piso de cima e o jogo inteiro deixa de funcionar.
  # Mas três é o mínimo, não o bom: com três, quem está no piso do
  # meio anda com a cabeça a um bloco do teto, e a sensação é de
  # corredor de porão. CINCO dá pé-direito sem chegar perto de
  # permitir a subida — um pulo sobe 1,25 e a volta ao piso de cima
  # pede sete.
  vao: 5

  # Quantos anéis da beira ficam em cor escura. É o aviso de
  # "aqui acaba": o olho não mede raio, mede contraste. Eles
  # derretem igual ao resto — beira que não derrete é lugar de
  # acampar, e acampar é o que mata este jogo.
  beira-aneis: 2

  # Altura do saguão acima do piso de cima.
  saguao-altura: 18
  saguao-raio: 9

  # Altura do parapeito de vidro do saguão. Três já basta — o
  # pulo sobe 1,25 —, mas quatro deixa a caixa parecendo caixa.
  saguao-parapeito: 4

  # Os quatro marcos, nos pontos cardeais. Ficam a raio+8 do
  # centro de propósito: perto o bastante para emoldurar, longe
  # o bastante para nenhum pulo da beira alcançar.
  marco-recuo: 8
  marco-altura: 30

  # De quantos em quantos blocos entra uma lâmpada na capa do
  # piso. Seis acende tudo sem o chão virar pisca-pisca — a luz do
  # Minecraft alcança quinze.
  luz-passo: 6

# -------------------------------------------------------------
#  Paleta
#
#  piso e piso-base DERRETEM. beira e beira-base também. O que
#  não está nessas quatro chaves o jogo nunca apaga — é o que
#  impede um defeito no derretimento de comer o saguão.
# -------------------------------------------------------------
paleta:
  # A placa de entrar e a de sair. Tem de ser uma placa de PAREDE —
  # se não for, o construtor avisa e usa a de carvalho.
  placa: CRIMSON_WALL_SIGN
  piso: TNT
  piso-base: SAND
  beira: POLISHED_BLACKSTONE
  beira-base: BLACKSTONE
  estrutura: QUARTZ_BLOCK
  escuro: POLISHED_DEEPSLATE
  borda: DEEPSLATE_TILES
  metal: IRON_BLOCK
  vidro: LIGHT_BLUE_STAINED_GLASS
  luz: SEA_LANTERN
  luz-fria: END_ROD

  # A luz DENTRO do piso, e ela é necessária: do segundo andar
  # para baixo o teto é o piso de cima, nenhuma luz do céu entra,
  # e o jogo virava correr no escuro. Estas lâmpadas ficam na capa
  # de cima de cada piso e acendem o andar que corre EM CIMA dele.
  #
  # Ela é um material DO PISO: derrete junto com o resto da coluna.
  # Se não fosse, cada rodada deixaria um céu de lâmpadas boiando
  # onde o piso sumiu.
  piso-luz: SHROOMLIGHT
  nucleo: AMETHYST_BLOCK

  # -----------------------------------------------------------
  #  AS CORES DA RUA DO SAGUÃO
  #
  #  O saguão dos vinte jogos é uma RUA DE VILA: avenida de grama
  #  entre duas fileiras de casas de dois andares, com o andar de
  #  cima em balanço sobre a calçada, floreiras nas janelas,
  #  lampiões pendurados, bandeirinhas atravessadas no alto e um
  #  arco monumental no fundo. A planta é a mesma nos vinte; o que
  #  muda de jogo para jogo é a COR, e é aqui que ela se muda.
  #
  #  Todas as chaves abaixo são opcionais e já têm padrão. Apagar
  #  qualquer uma não quebra nada: a rua nasce na cor de fábrica.
  #  Escrever só uma muda só ela.
  #
  #    grama          GRASS_BLOCK               o leito da avenida
  #    caminho        DIRT_PATH                 a trilha do meio
  #    alvenaria      COBBLESTONE               a calçada e o alicerce
  #    reboco         BIRCH_PLANKS              o pano claro das paredes
  #    viga           DARK_OAK_LOG              o madeiramento escuro
  #    madeira        SPRUCE_PLANKS             telhado e assoalho
  #    folhagem       OAK_LEAVES                copa e floreira
  #    flor           FLOWERING_AZALEA_LEAVES   o florido da janela
  #    lampiao        LANTERN                   pendurado no balanço
  #    mastro         OAK_FENCE                 o poste da calçada
  #    tronco         OAK_LOG                   a árvore da viela
  #    bandeira       PINK_WOOL                 bandeirinha, cor um
  #    bandeira-dois  LIGHT_BLUE_WOOL           bandeirinha, cor dois
  # -----------------------------------------------------------

# -------------------------------------------------------------
#  Regras
# -------------------------------------------------------------
regras:
  # Quantos têm de estar NA FILA para a contagem começar.
  #
  # Fila, e não "quem está no saguão": entra-se clicando na placa
  # [ENTRAR]. Quem chegou pelo portal e não clicou está visitando, e
  # ninguém é arrastado para uma largada sem ter pedido.
  #
  # Para jogar sozinho (treino contra o relógio) use
  # /biga tntrun comecar, que inscreve e larga na hora.
  minimo: 2

  # Teto de jogadores na rodada. Quem chega depois disso (ou com
  # a rodada já rolando) espera a próxima como espectador.
  maximo: 16

  # Segundos de contagem depois de o mínimo estar reunido.
  contagem-segundos: 20

  # Quantos segundos o jogador fica PARADO na arena antes de a rodada
  # abrir. Sem isso a largada põe o jogador num chão que em alguns jogos
  # já está sumindo, e ele perde antes de ver onde está.
  preparo-segundos: 5

  # Quantos ticks o bloco aguenta depois de alguém pisar nele.
  # Oito é 0,4 segundo: dá para passar correndo e não dá para
  # ficar parado. Abaixo de uns cinco o jogo vira sorte, acima
  # de uns quinze ninguém cai.
  derrete-ticks: 8

  # Quantos blocos abaixo do piso mais baixo elimina.
  queda-abaixo: 8

  # Segundos de comemoração antes de todos voltarem ao saguão.
  fim-segundos: 6

  # Rodada sozinho: vira corrida contra o relógio em vez de
  # acabar na hora por "só tem um de pé". É o que deixa o jogo
  # testável e treinável sem precisar de uma segunda pessoa.
  treino-sozinho: true

# -------------------------------------------------------------
#  Textos
# -------------------------------------------------------------
textos:
  titulo: "TNT RUN"
  cor: "#FF5555"
  subtitulo: "o chão some atrás de você"
  regras:
    - "clique em [ENTRAR] para entrar na fila"
    - "o bloco em que você pisa some"
    - "três pisos, três chances"
    - "último de pé ganha"
  escala-titulo: 2.6
  escala-placa: 1.6
  fundo-alpha: 0

  # O que vai escrito nas duas placas do saguão. A linha de baixo de
  # cada uma é o estado, e quem escreve é o jogo.
  placa-entrar: "[ENTRAR]"
  placa-sair: "[SAIR]"
  placa-fila: "na fila"
  placa-esperando: "esperando"
  placa-jogando: "JOGANDO"
  placa-refazendo: "refazendo"
