# =============================================================
# ChestShop 3.13-pre-1 — política econômica BigaCore
#
# O plugin completa chaves ausentes com os próprios defaults.
# Mantemos aqui somente as decisões que pertencem ao projeto.
# =============================================================

# Não atualizar JAR automaticamente. A versão é fixada e testada no repo.
TURN_OFF_UPDATES: true

# Usa a linguagem do cliente quando possível; inglês é o fallback seguro.
DEFAULT_LANGUAGE: "pt_BR"
USE_CLIENT_LOCALE: true

# A Biga Market é a loja DO SERVIDOR: as placas do balcão do fundo são Admin
# Shops de estoque infinito, geradas pelo BigaCore a partir de economy.yml.
#
# ADMIN_SHOP_NAME precisa ser IDÊNTICO a admin-shop.sign-owner do
# plugins/BigaCore/economy.yml. Se divergir, a placa vira loja de um jogador
# inexistente e ninguém consegue comprar.
#
# As placas VENDEM e COMPRAM (linha "B <venda>:<compra> S"). O ChestShop não
# sabe aplicar teto por jogador, então quem protege o lado da compra é o
# BigaCore: ChestShopCapGuard escuta PreTransactionEvent e cancela a venda que
# passar do teto diário. Sem esse hook, uma farm AFK viraria impressora de
# dinheiro — se o console avisar que o teto não subiu, desligue
# admin-shop.placa-compra no economy.yml.
ADMIN_SHOP_NAME: "Loja do Servidor"
FORCE_UNLIMITED_ADMIN_SHOP: true

# Vazio de propósito: os 4% abaixo são retirados de circulação (money sink),
# em vez de irem para uma conta que poderia voltar a gastar a mesma moeda.
SERVER_ECONOMY_ACCOUNT: ""
TAX_AMOUNT: 4
SERVER_TAX_AMOUNT: 0

# Abrir loja precisa ter custo para impedir spam e funcionar como sink.
SHOP_CREATION_PRICE: 50
SHOP_REFUND_PRICE: 10

# Biga (B$) trabalha com valores inteiros na política inicial.
PRICE_PRECISION: 0
ALLOW_PARTIAL_TRANSACTIONS: false

# Proteções contra lojas/placas acidentalmente exploráveis.
BLOCK_SHOPS_WITH_SELL_PRICE_HIGHER_THAN_BUY_PRICE: true
MAX_SHOP_AMOUNT: 576
ALLOW_MULTIPLE_SHOPS_AT_ONE_BLOCK: false

# Shift-click vende por stacks, não "todo o inventário" de uma vez.
SHIFT_SELLS_IN_STACKS: true
SHIFT_SELLS_EVERYTHING: false

# Auditoria e proteção física das lojas.
LOG_TO_FILE: true
LOG_TO_CONSOLE: true
LOG_ALL_SHOP_REMOVALS: true
USE_BUILT_IN_PROTECTION: true
TURN_OFF_SIGN_PROTECTION: false
TURN_OFF_HOPPER_PROTECTION: false
