# ChestShop — mensagens em português do Biga Market.
#
# O ChestShop NÃO usa código de cor do Spigot: ele passa tudo pelo MineDown.
# Hex aqui é '&#RRGGBB&' (com o & final). O formato '&x&R&R&G&G&B&B' aparece
# literalmente no chat como "&x" — foi o que quebrou a versão anterior.
# No MineDown _texto_ vira itálico e **texto** vira negrito: evite nos textos.
#
# Paleta (a mesma do BigaCore):
#   #FFD700 marca/destaque   #FF6A00 dinheiro   #56D364 deu certo
#   #E03131 deu errado       #AAAAAA apoio      &f texto normal

prefix: '[&lLOJA](#FFD700-#FF6A00) &8» &r'

