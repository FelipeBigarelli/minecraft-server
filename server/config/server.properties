# =============================================================
#  server.properties — Paper 26.3
#  Copie para a raiz do servidor antes do primeiro boot.
# =============================================================

# --- Identidade ---------------------------------------------
motd=§x§2§e§2§e§3§3▬§x§6§2§5§8§2§6▬§x§9§6§8§2§1§a▬§x§c§b§a§d§0§d▬§x§f§f§d§7§0§0▬  §x§f§f§d§7§0§0§lT§x§f§f§c§7§0§0§lH§x§f§f§b§8§0§0§lE §x§f§f§a§8§0§0§lB§x§f§f§9§9§0§0§lI§x§f§f§8§9§0§0§lG§x§f§f§7§a§0§0§lA§x§f§f§6§a§0§0§lS  §x§f§f§6§a§0§0▬§x§c§b§5§b§0§d▬§x§9§6§4§c§1§a▬§x§6§2§3§d§2§6▬§x§2§e§2§e§3§3▬\n§7Sobrevivência  §6◆  §7Economia  §6◆  §7Construção
server-port=25565
server-ip=
max-players=100

# --- Mundo --------------------------------------------------
level-name=world
level-seed=
level-type=minecraft\:normal
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
allow-nether=true
generate-structures=true
spawn-monsters=true
spawn-protection=0

# --- Performance --------------------------------------------
# view-distance é o parâmetro que mais pesa em CPU e banda.
# 10 é o default; 6-8 é um bom equilíbrio em VPS modesta.
view-distance=20
# simulation-distance controla quantos chunks realmente "rodam"
# (mobs, redstone, crescimento). Baixar aqui alivia muito mais
# que baixar view-distance, e o jogador nem percebe.
simulation-distance=18
max-tick-time=60000
sync-chunk-writes=false
entity-broadcast-range-percentage=100

# --- Acesso / segurança -------------------------------------
# online-mode=true valida a conta na Mojang. Está false aqui de
# propósito, para o crossplay com Bedrock (Geyser) — veja
# docs/bedrock-switch.md. Em false, qualquer um entra com qualquer
# nick, inclusive com o nick de um operador. É seguro só porque o
# servidor vive na LAN. ANTES de abrir qualquer porta na internet,
# ligue white-list=true e enforce-whitelist=true.
online-mode=false
white-list=false
enforce-whitelist=false
# true faz o cliente verificar a assinatura das mensagens de chat. Em false,
# o jogador vê o aviso amarelo "não é possível verificar as mensagens".
# O crossplay com Bedrock voltou (Geyser), mas em online-mode=false o
# servidor já ignora este campo: o boot avisa "RUNNING IN OFFLINE/INSECURE
# MODE" e ninguém vê o aviso amarelo. Deixado em true para quando o
# online-mode voltar.
enforce-secure-profile=true
prevent-proxy-connections=false

# --- Anti-spam (novo na 26.2) -------------------------------
# A 26.2 separou o anti-spam de chat do de comandos.
# Valores em segundos; 10 é o default de ambos.
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10

# --- Administração ------------------------------------------
enable-command-block=false
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true

# --- RCON (console remoto) ----------------------------------
# Deixe false a menos que precise. Se ativar, use senha forte e
# NUNCA exponha a porta 25575 na internet aberta.
#
# 🔴 ESTE ARQUIVO ESTA NO GIT. Se um dia voce preencher a
#    rcon.password aqui, ela vai para o GitHub e fica no historico
#    para sempre — apagar num commit seguinte nao resolve.
#    Preencha a senha APENAS em ~/minecraft/server.properties,
#    que nao e versionado. Mantenha este campo vazio.
enable-rcon=false
rcon.port=25575
rcon.password=

# --- Servidor de gerenciamento (novo na 26.3) ---------------
# API de administração remota. Fica desligada, e deve continuar:
# é um console com autenticação por segredo compartilhado.
#
# 🔴 O servidor GERA um management-server-secret sozinho no primeiro
#    boot e grava em ~/minecraft/server.properties. Esse campo aqui
#    fica VAZIO pelo mesmo motivo que o rcon.password.
management-server-enabled=false
management-server-host=localhost
management-server-port=0
management-server-secret=
management-server-tls-enabled=true

# --- Query --------------------------------------------------
enable-query=false
query.port=25565

# --- Misc ---------------------------------------------------
allow-flight=false
force-gamemode=false
player-idle-timeout=0
max-world-size=29999984
network-compression-threshold=256
require-resource-pack=false
resource-pack=
resource-pack-sha1=
hide-online-players=false
log-ips=true
